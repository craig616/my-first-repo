<title>Supper Wireframe Prototype</title>
<style>

  body { margin:0; background:#0c0c0c; color:var(--ink); font:16px/1.45 var(--font); }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; }

<script>
__SOUND__
const R = __DATA__;
const IMG = c => `img/${c}.jpg`;
const K = 'sw2_';
const S = { get(k, d) { try { const v = localStorage.getItem(K + k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(K + k, JSON.stringify(v)); } catch {} } };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const $ = id => document.getElementById(id);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const byId = id => R.find(r => r.id === id);

/* ---------- context ---------- */
const now = new Date(), dow = now.getDay(), mon = now.getMonth() + 1, hr = now.getHours();
const DAY = now.toLocaleDateString('en-GB', { weekday:'long' });
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const PART = hr < 11 ? 'morning' : hr < 17 ? 'afternoon' : 'evening';
const SEASON = mon <= 2 || mon === 12 ? 'winter' : mon <= 5 ? 'spring' : mon <= 8 ? 'summer' : 'autumn';
const EDGE = { 3:'winter', 6:'spring', 9:'summer', 12:'autumn' }[mon];
const PHASE = ({ 9:'early ', 10:'mid ', 11:'late ', 12:'early ', 1:'mid ', 2:'late ', 3:'early ', 4:'mid ', 5:'late ', 6:'early ', 7:'high ', 8:'late ' })[mon] + SEASON;
const RHYTHM = [2,3,4].includes(dow) ? 'fresh' : [0,1].includes(dow) ? 'cupboard' : null;
const daysAgo = n => new Date(Date.now() - n * 864e5).toISOString();
const dayName = iso => { const d = new Date(iso), diff = Math.floor((Date.now() - d) / 864e5); return diff < 1 ? 'today' : diff < 2 ? 'yesterday' : diff < 7 ? DAYS[d.getDay()] : 'last week'; };
const weekKey = () => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 5) % 7)); return d.toISOString().slice(0, 10); }; // weeks run from Tuesday (box day)

/* ---------- the Kitchen: have / running low / out, no quantities ---------- */
const STAPLES = ['salt','black pepper','olive oil','vegetable oil','water','garlic','onion','sugar','plain flour','butter','eggs'];
const FRESH = new Set(['cod','salmon','tinned fish','anchovies','spinach','bok choy','mushrooms','enoki mushrooms','leek','spring onion','firm tofu','silken tofu','feta','lemon','lime','parsley','dill','chives','basil','coriander','thyme','rosemary','sage','courgette','greek yoghurt','cream cheese','single cream','whipping cream','sour cream','halloumi','brie','quark','parmesan','cabbage','carrot','aubergine','broccolini','broccoli','cauliflower','tomatoes','cherry tomatoes','cucumber','avocado','pear','potatoes','sweet potato','kabocha squash','squash','fennel','celery','beetroot','red pepper','red onion','green beans','edamame','kimchi','ginger','chillies','jalapeno','beef','mayonnaise','gnocchi','pickles']);
const BOX = ['cod','spinach','leek','mushrooms','courgette','bok choy','lemon','potatoes','kabocha squash'];
const SEED_K = [
  ['cod','fridge',2], ['salmon','fridge',2], ['spinach','fridge',2,'low'], ['bok choy','fridge',2], ['mushrooms','fridge',3], ['spring onion','fridge',4],
  ['firm tofu','fridge',5], ['feta','fridge',6], ['lemon','fridge',3], ['parsley','fridge',4], ['greek yoghurt','fridge',5], ['courgette','fridge',2],
  ['soy sauce','cupboard',30], ['mirin','cupboard',30], ['rice','cupboard',30], ['pasta','cupboard',30], ['chickpeas','cupboard',30], ['sesame seeds','cupboard',30],
  ['sesame oil','cupboard',30], ['honey','cupboard',30], ['orzo','cupboard',30], ['tinned tomatoes','cupboard',30], ['butter beans','cupboard',30], ['white miso','cupboard',30],
  ['chilli oil','cupboard',30], ['peanut butter','cupboard',30], ['vegetable stock','cupboard',30], ['sake','cupboard',30,'out'], ['tahini','cupboard',30], ['rice wine vinegar','cupboard',30]
].map(([name, place, ago, state]) => ({ name, place, state: state || 'have', added: daysAgo(ago) }));

let me = S.get('me', 'Craig');
const other = () => me === 'Craig' ? 'Mary' : 'Craig';
let kitchen = S.get('kitchen', SEED_K);
let toBuy = S.get('toBuy', [{ name:'sake', for:'japanese-mirin-baked-cod' }]);
let recentOut = S.get('recentOut', ['sake','spring onion','lime']);
let boxWeek = S.get('boxWeek', null);
let list = S.get('list', [
  { id:'cod-grenobloise', by:'Mary', at:daysAgo(1) },
  { id:'chilli-peanut-crispy-rice-salad-with-honey-soy-salmon', by:'Craig', at:daysAgo(4) },
  { id:'charred-hispi-cabbage-with-whipped-miso-tofu', by:'Mary', at:daysAgo(3) },
  { id:'tofu-okonomiyaki', by:'Craig', at:daysAgo(8) }]);
let hist = S.get('hist', { 'pasta-e-ceci':{ n:5, last:daysAgo(16) }, 'japanese-mirin-baked-cod':{ n:3, last:daysAgo(24) }, 'hoisin-garlic-noodles':{ n:6, last:daysAgo(6) }, 'sukiyaki':{ n:1, last:daysAgo(9) }, 'creamy-tomato-and-basil-beans':{ n:4, last:daysAgo(35) }, 'spaghetti-alla-nerano':{ n:2, last:daysAgo(70) } });
let prefs = S.get('prefs', { Craig:['more chilli'], Mary:['no coriander','less sugar'] });
let favs = S.get('favs', { Craig:['japanese-mirin-baked-cod','pasta-e-ceci','hoisin-garlic-noodles','spaghetti-alla-nerano'], Mary:['japanese-mirin-baked-cod','pasta-e-ceci','creamy-tomato-and-basil-beans'] });
let logs = S.get('logs', [
  { id:'pasta-e-ceci', iso:daysAgo(2), cook:'Mary', was:'lovely', but:'was perfect as is', next:'change nothing', again:'make it again soon', ex:true },
  { id:'sukiyaki', iso:daysAgo(9), cook:'we both', was:'really good', but:'was a bit much work', next:'make it ahead', again:'keep it for a weekend', ex:true }]);
let cooking = S.get('cooking', null);     // { id, step }
let usual = S.get('usual', 'both');
const save = () => { S.set('kitchen', kitchen); S.set('toBuy', toBuy); S.set('recentOut', recentOut); S.set('boxWeek', boxWeek); S.set('list', list); S.set('favs', favs); S.set('logs', logs); S.set('cooking', cooking); S.set('me', me); S.set('usual', usual); S.set('hist', hist); S.set('prefs', prefs); S.set('moodMode', moodMode); };

const norm = s => s.toLowerCase().trim();
const same = (a, b) => { a = norm(a); b = norm(b); return a === b || (a.length > 3 && b.length > 3 && (a.includes(b) || b.includes(a))); };
const kItem = n => kitchen.find(k => same(k.name, n));
const isStaple = n => STAPLES.some(s => same(s, n));
const inKitchen = n => isStaple(n) || (kItem(n) && kItem(n).state !== 'out');
const placeOf = n => FRESH.has(norm(n)) || [...FRESH].some(f => same(f, n)) ? 'fridge' : 'cupboard';
const VOCAB = [...new Set(R.flatMap(r => r.ingredients_canonical || []).concat(BOX, kitchen.map(k => k.name)))].sort();
function addToKitchen(n, quiet) {
  const k = kItem(n);
  if (k) { k.state = 'have'; k.added = new Date().toISOString(); }
  else kitchen.push({ name:norm(n), place:placeOf(n), state:'have', added:new Date().toISOString() });
  recentOut = recentOut.filter(x => !same(x, n));
  save(); if (!quiet) toast(`${cap(n)} added to the Kitchen`);
}
function needs(r) { return (r.ingredients_canonical || []).filter(n => !isStaple(n)); }
function haveTxt(r) { const n = needs(r); return n.length ? `have ${n.filter(inKitchen).length} of ${n.length}` : ''; }

/* ---------- recipes: time, labels, ranking ---------- */
function minutes(r) { if (r.total_min) return r.total_min; const s = (r.steps || []).reduce((a, x) => a + (x.timer_min || 0), 0); return s || null; }

  day:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'], cook:['Mary','Craig','we both'], was:['lovely','really good','fine','not for us'],
  but:['was perfect as is','needed more seasoning','needed longer','was a bit salty','was a bit sweet','needed more sauce','was a bit much work'],
  next:['change nothing','double it','add more garlic','add more chilli','use less sugar','make it ahead'], again:['make it again soon','keep it for a weekend','not make it again'] };
const LABS = { day:'On…', cook:'Who cooked…', was:'It was…', but:'But it…', next:'Next time…', again:"We'll…" };
const ORDER = ['was','but','next','again'];
const shortName = r => r.title.length > 34 ? r.title.split(/ with | and /)[0] : r.title;
function storyText(l) { const r = byId(l.id); return `On ${DAYS[new Date(l.iso).getDay()]}, ${l.cook} made the ${shortName(r)}. It was ${l.was}, but it ${l.but}. Next time, ${l.next}. We'll ${l.again}.`; }
let sto = null, sact = null, bankReady = 0;
function storyHTML(placed) {
  const slot = k => sto[k] ? `<span class="w${placed === k ? ' placed' : ''}" role="button" tabindex="0" data-sk="${k}">${esc(sto[k])}</span>` : `<span class="blank${sact === k ? ' active' : ''}" role="button" tabindex="0" aria-label="${LABS[k]} choose" data-sk="${k}"></span>`;
  return `On ${slot('day')}, ${slot('cook')} made the <span class="w dish">${esc(shortName(sto.r))}</span>. It was ${slot('was')}, but it ${slot('but')}. Next time, ${slot('next')}. We'll ${slot('again')}.`;
}
const complete = () => ORDER.every(k => sto[k]);
function story(id) {
  const r = byId(id); clearInterval(tick); timers = timers.filter(t => t.id !== id); S.set('timers', timers);
  const fresh = needs(r).filter(n => kItem(n) && kItem(n).place === 'fridge' && kItem(n).state !== 'out');
  const cw = cooking?.who === 'both' ? 'we both' : cooking?.who || me;
  sto = { r, day:DAY, cook:cw, makeFav:false, was:null, but:null, next:null, again:null, used:new Set(), offList:onList(id), fresh }; sact = null;
  $('layer').innerHTML = `<div class="view" id="sv" role="dialog" aria-modal="true" aria-label="How did it go?"><div class="inner" style="padding-top:calc(14px + env(safe-area-inset-top, 0px))">
    <div class="top"><button class="chip ghost" style="padding-left:0" data-a="cook" data-v="${id}">‹ Steps</button><button class="chip ghost" data-a="snd" aria-pressed="${on}">Sound ${on ? 'on' : 'off'}</button></div>
    <div class="meta">How did it go?</div>
    <div class="story" id="story">${storyHTML()}</div>
    <div class="meta" id="shint" style="margin-top:10px">Tap a gap to fill it in. Tap a word to change it.</div>
    <div id="sx"></div>
  </div></div>
  <div class="nav2"><button data-a="skipstory">Not now</button><button data-a="savestory" aria-disabled="true">Save to our log</button></div>
  <div class="wbank" id="wb" role="dialog" aria-label="Choose a word"><div class="grab" style="width:40px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 12px"></div><div class="lab" id="wbl" style="margin-top:0"></div><div class="opts" id="wbc"></div></div>`;
  drawExtras();
  setTimeout(() => openGap(ORDER.find(k => !sto[k])), 450);
}
function drawExtras() {
  $('sx').innerHTML = `${sto.fresh.length ? `<div class="banner" style="display:block;margin-top:24px">Used up anything?<div class="chips" style="margin-top:8px">${sto.fresh.map(n => `<button class="chip ${sto.used.has(n) ? 'on' : ''}" data-a="usedup" data-v="${esc(n)}" aria-pressed="${sto.used.has(n)}">${esc(n)}${sto.used.has(n) ? ' ✓' : ''}</button>`).join('')}</div><div class="meta" style="margin-top:6px">Ticked items are marked as out in the Kitchen.</div></div>` : ''}
    ${onList(sto.r.id) ? `<button class="tick" style="margin-top:12px" data-a="offlist" aria-pressed="${sto.offList}"><i>${sto.offList ? '✓' : ''}</i><span>Take it off Want to try (we've tried it now)</span></button>` : ''}
    ${!favs[me].includes(sto.r.id) && ['lovely','really good'].includes(sto.was) ? `<button class="tick" data-a="makefav" aria-pressed="${sto.makeFav}"><i>${sto.makeFav ? '✓' : ''}</i><span>Make it one of my favourites ♥</span></button>` : ''}`;
}
function openGap(k) {
  if (!k) return; sact = k; $('wbl').textContent = LABS[k];
  $('wbc').innerHTML = BANKS[k].map(w => `<button data-sw="${esc(w)}">${esc(w)}</button>`).join('');
  $('wb').classList.add('open'); $('story').innerHTML = storyHTML(); sfx.open(); bankReady = Date.now() + 320;
  setTimeout(() => $('wbc').querySelector('button')?.focus({ preventScroll:true }), 330);
}
function placeWord(w) {
  if (Date.now() < bankReady) return;
  const k = sact, was = complete(); sto[k] = w; sact = null; sfx.place();
  if (k === 'again') sto.offList = w !== 'make it again soon' ? sto.offList : false;
  $('wb').classList.remove('open'); $('story').innerHTML = storyHTML(k); drawExtras();
  const btn = document.querySelector('[data-a="savestory"]'); btn.setAttribute('aria-disabled', String(!complete()));
  if (complete() && !was) { $('shint').textContent = 'All filled in. Save it, or tap a word to change it.'; setTimeout(() => { sfx.ready(); $('story').classList.add('done'); }, 220); }
  else { const nx = ORDER.find(x => !sto[x]); if (nx) setTimeout(() => openGap(nx), 380); }
}
function saveStory() {
  if (!complete()) { $('shint').textContent = 'Fill in the gaps first.'; return openGap(ORDER.find(x => !sto[x])); }
  sfx.save();
  const r = sto.r;
  logs.unshift({ id:r.id, iso:new Date().toISOString(), cook:sto.cook, was:sto.was, but:sto.but, next:sto.next, again:sto.again });
  sto.used.forEach(n => { const k = kItem(n); if (k) { k.state = 'out'; recentOut = [n, ...recentOut.filter(x => !same(x, n))].slice(0, 8); } });
  if (sto.offList) list = list.filter(x => x.id !== r.id);
  if (sto.makeFav && !favs[me].includes(r.id)) favs[me].push(r.id);
  if (sto.was === 'not for us') { favs.Craig = favs.Craig.filter(x => x !== r.id); favs.Mary = favs.Mary.filter(x => x !== r.id); }
  cooking = null; save();
  $('layer').innerHTML = ''; go(returnTo || 'log'); toast(`Saved to our log${sto.used.size ? ` · ${sto.used.size} marked out in the Kitchen` : ''}`);
}

/* ---------- 8 · Ours: Want to try (a queue) and Favourites (go-tos) ---------- */

/* ---------- 9 · Log ---------- */

/* ---------- 11 · Add to the Kitchen ---------- */
let ak = { q:'', pend:new Set(), paste:false };
function addKitchen() { ak = { q:'', pend:new Set(), paste:false }; drawAddK(true); }
function drawAddK(first) {
  const q = norm(ak.q), boxIn = boxWeek === weekKey();
  const hits = q ? VOCAB.filter(v => v.includes(q) && !(kItem(v) && kItem(v).state !== 'out')).slice(0, 6) : [];
  const t = n => `<button class="tick" data-a="akt" data-v="${esc(n)}" aria-pressed="${ak.pend.has(n)}"><i>${ak.pend.has(n) ? '✓' : ''}</i><span>${esc(n)} <span class="meta">· ${placeOf(n)}${inKitchen(n) ? ', already in' : ''}</span></span></button>`;
  const body = `<div class="top"><b style="font-weight:400;font-size:19px">Add to the Kitchen</b><button class="chip ghost" data-a="akclose">Cancel</button></div>
    <input class="box" id="akq" placeholder="Type an ingredient" value="${esc(ak.q)}" autocomplete="off" aria-label="Type an ingredient" style="margin-top:10px">
    ${q ? (hits.length ? hits.map(t).join('') : `<button class="tick" data-a="akt" data-v="${esc(q)}" aria-pressed="${ak.pend.has(q)}"><i>${ak.pend.has(q) ? '✓' : ''}</i><span>Add "${esc(q)}" <span class="meta">· ${placeOf(q)}</span></span></button>`) : ''}
    ${[...ak.pend].filter(n => !BOX.includes(n) && !recentOut.includes(n) && !hits.includes(n)).length ? `<div class="lab">Ready to add</div>${[...ak.pend].filter(n => !BOX.includes(n) && !recentOut.includes(n) && !hits.includes(n)).map(t).join('')}` : ''}
    ${!boxIn ? `<div class="lab">From this week's box</div>${BOX.map(t).join('')}` : ''}
    <div class="lab">Recently used up</div><div class="chips">${recentOut.map(n => `<button class="chip ${ak.pend.has(n) ? 'on' : ''}" data-a="akt" data-v="${esc(n)}" aria-pressed="${ak.pend.has(n)}">+ ${esc(n)}</button>`).join('') || '<span class="meta">Nothing yet.</span>'}</div>
    <div class="lab">Other ways</div>
    ${ak.paste ? `<textarea id="akp" rows="4" placeholder="One per line, or separated by commas" style="width:100%;background:var(--raise);border:0;border-radius:12px;padding:12px;outline:none"></textarea><button class="chip" style="margin-top:8px" data-a="akpaste">Add these</button>` : `<div class="chips"><button class="chip" data-a="akpasteopen">Paste a list</button><span class="chip ghost">Receipt photo (later)</span><span class="chip ghost">Box email (later)</span></div>`}`;
  if (first) $('layer').innerHTML = `<div class="scrim" data-a="akclose"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Add to the Kitchen"><div class="grab"></div><div id="akb">${body}</div><div class="foot"><button class="btn" id="akgo" data-a="akgo"></button></div></div>`;
  else { const had = document.activeElement?.id === 'akq', pos = had ? $('akq').selectionStart : 0; $('akb').innerHTML = body; if (had) { $('akq').focus(); $('akq').setSelectionRange(pos, pos); } }
  $('akgo').textContent = ak.pend.size ? `Add ${ak.pend.size} to the Kitchen` : 'Done';
  $('akq').oninput = e => { ak.q = e.target.value; drawAddK(); };
  $('akq').onkeydown = e => { if (e.key === 'Enter' && norm(ak.q)) { ak.pend.add(hits[0] || norm(ak.q)); ak.q = ''; drawAddK(); $('akq').focus(); } };
}

    ${['Craig','Mary'].map(p => `<div class="meta" style="margin:8px 0 4px">${p}</div><div class="chips">${PREFS.map(x => `<button class="chip ${prefs[p].includes(x) ? 'on' : ''}" data-a="pref" data-v="${x}" data-p="${p}" aria-pressed="${prefs[p].includes(x)}">${x}</button>`).join('')}</div>`).join('')}
    <p class="meta">Recipes and cook mode show a tweak when the cook or the people eating like something done differently.</p>
    <div class="lab">Usually eating</div><div class="chips">${opt('usual', 'both', usual, 'Both of us')}${opt('usual', 'mary', usual, 'Mary')}${opt('usual', 'craig', usual, 'Craig alone')}</div>
    <p class="meta">Tonight shows a chip only when it's different from this. Change it for one evening in the filters.</p>
    <div class="lab">Kitchen</div>
    <div class="set"><span>Oven</span><span class="meta">fan, °C</span></div><div class="set"><span>Hob</span><span class="meta">induction, 1–9</span></div>
    <div class="set"><span>Units</span><span class="meta">grams, ml</span></div><div class="set"><span>Box day</span><span class="meta">Tuesday</span></div>
    <div class="set"><span>Always in</span><span class="meta">${STAPLES.length} staples</span></div>
    <div class="lab">App</div>
    <div class="set"><span>Sounds</span><button class="chip" data-a="snd" aria-pressed="${on}">${on ? 'On' : 'Off'}</button></div>
    <div class="set"><span>Season nudge</span><span class="meta">gentle</span></div>
    <div class="lab">Feel like (trying both)</div><div class="chips">${opt('moodmode', 'one', moodMode, 'One choice')}${opt('moodmode', 'many', moodMode, 'Several')}</div>
    <div class="lab">Prototype</div><button class="chip" data-a="reset">Reset the example data</button>
  </div></div>`;
}

/* ---------- events ---------- */
function closeLayer() { $('layer').innerHTML = ''; clearInterval(tick); render(); }
document.addEventListener('click', e => {
  const sk = e.target.closest('[data-sk]'); if (sk && sto) { if (sto[sk.dataset.sk]) sfx.lift(); return openGap(sk.dataset.sk); }
  if (sact && !e.target.closest('#wb') && $('wb')) { $('wb').classList.remove('open'); sact = null; $('story').innerHTML = storyHTML(); }
  const sw = e.target.closest('[data-sw]'); if (sw) return placeWord(sw.dataset.sw);
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (t.tagName === 'A') return;
  e.preventDefault();
  switch (a) {
    case 'tab': $('layer').innerHTML = ''; return go(v);
    case 'library': return go('tonight', 'library');
    case 'browse': lib.show = v; return go('tonight', 'library');
    case 'filters': e.stopPropagation(); return filters();
    case 'filtersdone': $('layer').innerHTML = ''; return go('tonight', 'library');
    case 'libf': lib[t.dataset.k] = v; if ($('layer').innerHTML) { filters(); } render(); return;
    case 'eaterf': st.eater = v; filters(); return render();
    case 'libclear': lib = { q:'', meal:'all', time:'any', hands:'any', show:'', sort:'best' }; st.eater = usual; filters(); return render();
    case 'libq': lib.q = ''; return render();
    case 'eater': st.eater = v; return render();
    case 'mood': if (moodMode === 'one') st.moods = st.moods[0] === v ? [] : [v]; else st.moods = st.moods.includes(v) ? st.moods.filter(x => x !== v) : [...st.moods, v]; return render();
    case 'moodmode': moodMode = v; if (v === 'one') st.moods = st.moods.slice(0, 1); save(); render(); if (document.querySelector('[aria-label="Household"]')) settings(); return;
    case 'ours': oseg = v; return go('list');
    case 'oseg': oseg = v; return render();
    case 'who': who = v; return recipe(rid, true);
    case 'job': { const r = byId(rid), j = jobsFor(r); jobsBy[r.id] = { ...(jobsBy[r.id] || {}), [v]: { Craig:'Mary', Mary:'both', both:'Craig' }[j[+v]] }; S.set('jobs', jobsBy); return recipe(rid, true); }
    case 'station': { const r = byId(rid), o = { ...owners(r) }; o[v] = o[v] === 'Craig' ? 'Mary' : 'Craig'; stationsBy[r.id] = o; S.set('stations', stationsBy); if (jobsBy[r.id]) { delete jobsBy[r.id]; S.set('jobs', jobsBy); } return recipe(rid, true); }
    case 'handover': case 'takeover': { const r = byId(cooking.id); jobsBy[r.id] = { ...(jobsBy[r.id] || {}), [v]: t.dataset.p }; S.set('jobs', jobsBy); sfx.lift(); toast(`Step ${+v + 1} is ${t.dataset.p}'s now`); return cookTogether(r.id); }
    case 'lanedone': { cooking.done = [...new Set([...(cooking.done || []), +v])]; cooking.last = [...(cooking.last || []), +v]; save(); sfx.place(); return cookTogether(cooking.id); }
    case 'undolane': { const l = (cooking.last || []).pop(); cooking.done = (cooking.done || []).filter(x => x !== l); save(); sfx.lift(); return cookTogether(cooking.id); }
    case 'startt2': { const r = byId(cooking.id), k = +v, s = r.steps[k]; timers.push({ id:cooking.id, step:k, min:s.timer_min, label:/marina/i.test(s.text) ? 'Marinating' : /oven|bake|roast/i.test(s.text) ? 'In the oven' : `Step ${k + 1}`, end:Date.now() + s.timer_min * 60000 }); S.set('timers', timers); return cookTogether(cooking.id); }
    case 'makefav': sto.makeFav = !sto.makeFav; return drawExtras();
    case 'pref': { const p = t.dataset.p; prefs[p] = prefs[p].includes(v) ? prefs[p].filter(x => x !== v) : [...prefs[p], v]; save(); return settings(); }
    case 'with': if (!st.withs.includes(v)) st.withs.push(v); return render();
    case 'unwith': st.withs = st.withs.filter(x => x !== v); return render();
    case 'clearchoice': st.moods = []; st.withs = []; return render();
    case 'picker': return picker();
    case 'pkt': st.withs.includes(v) ? st.withs = st.withs.filter(x => x !== v) : st.withs.push(v); pk.q = ''; return drawPicker();
    case 'pkadd': pk.alsoAdd.has(v) ? pk.alsoAdd.delete(v) : pk.alsoAdd.add(v); return drawPicker();
    case 'pkclear': st.withs = []; return drawPicker();
    case 'pkdone': pk.alsoAdd.forEach(n => { if (st.withs.includes(n)) addToKitchen(n, true); }); if (pk.alsoAdd.size) toast('Added to the Kitchen too'); pk.alsoAdd.clear(); $('layer').innerHTML = ''; return go('tonight');
    case 'cookwith': tab = 'tonight'; sub = null; render(); return picker();
    case 'open': returnTo = tab; who = cooking && cooking.id === v ? cooking.who : me; return recipe(v);
    case 'close': return closeLayer();
    case 'list': { const L = list.find(x => x.id === v); if (L) list = list.filter(x => x.id !== v); else { list.push({ id:v, by:me, at:new Date().toISOString() }); toast(`Added to Want to try · ${other()} will see it`); } save(); return recipe(v, true); }
    case 'fav': favs[me] = favs[me].includes(v) ? favs[me].filter(x => x !== v) : [...favs[me], v]; save(); if (document.getElementById('rv')) recipe(v, true); else render(); return;
    case 'needmenu': return needMenu(v);
    case 'havethis': addToKitchen(v); document.getElementById('needsheet')?.remove(); return recipe(rid, true);
    case 'buythis': toBuy.push({ name:v, for:rid }); save(); toast(`${cap(v)} added to To buy`); document.getElementById('needsheet')?.remove(); return recipe(rid, true);
    case 'closesheet': return document.getElementById(v)?.remove();
    case 'cook': return cook(v);
    case 'step': return cook(cooking.id, +v);
    case 'startt': { const s = byId(cooking.id).steps[cooking.step]; timers.push({ id:cooking.id, step:cooking.step, min:+v, label:/marina/i.test(s.text) ? 'Marinating' : /oven|bake|roast/i.test(s.text) ? 'In the oven' : `Step ${cooking.step + 1}`, end:Date.now() + v * 60000 }); S.set('timers', timers); return cook(cooking.id, cooking.step); }
    case 'dropt': { const tt = timers[+v]; if (tt && tt.end <= Date.now()) { timers.splice(+v, 1); S.set('timers', timers); drawTimers(); } else toast('The timer keeps running. Tap it again when it\'s done.'); return; }
    case 'leavecook': clearInterval(tick); $('layer').innerHTML = ''; toast('Your place is kept'); return render();
    case 'stopcook': cooking = null; timers = []; S.set('timers', timers); save(); return render();
    case 'cookings': { const r = byId(cooking.id); return sheet(`<b style="font-weight:400;font-size:19px">Ingredients</b>${(r.ingredients || []).map(i => `<div class="il"><span>${esc(i.heading || i.text)}</span></div>`).join('')}`, 'ingsheet'); }
    case 'done': return story(cooking.id);
    case 'snd': on = !on; if (on) sfx.toggle(true); t.textContent = t.textContent.startsWith('Sound') ? `Sound ${on ? 'on' : 'off'}` : on ? 'On' : 'Off'; t.setAttribute('aria-pressed', on); return;
    case 'usedup': sto.used.has(v) ? sto.used.delete(v) : sto.used.add(v); sfx.place(); return drawExtras();
    case 'offlist': sto.offList = !sto.offList; return drawExtras();
    case 'skipstory': sfx.lift(); cooking = null; save(); $('layer').innerHTML = ''; return go(returnTo || 'tonight');
    case 'savestory': return saveStory();
    case 'addrecipe': return addRecipe();
    case 'arsubmit': return runAdd();
    case 'artoggle': { const p = t.getAttribute('aria-pressed') !== 'true'; t.setAttribute('aria-pressed', p); t.querySelector('i').textContent = p ? '✓' : ''; return; }
    case 'mv': { const k = +v; if (k > 0) { [list[k - 1], list[k]] = [list[k], list[k - 1]]; save(); sfx.place(); } return render(); }
    case 'unlist': list = list.filter(x => x.id !== v); save(); return render();
    case 'logseg': logSeg = v; return render();
    case 'kseg': kseg = v; return render();
    case 'cycle': { const k = kItem(v); k.state = { have:'low', low:'out', out:'have' }[k.state]; if (k.state === 'out') recentOut = [k.name, ...recentOut.filter(x => x !== k.name)].slice(0, 8); save(); return render(); }
    case 'rmk': kitchen = kitchen.filter(k => k.name !== v); save(); toast(`${cap(v)} removed`); return render();
    case 'box': BOX.forEach(n => addToKitchen(n, true)); boxWeek = weekKey(); save(); sfx.save(); toast(`The box is in · ${BOX.length} things added`); return render();
    case 'unbox': boxWeek = null; save(); return render();
    case 'bought': { toBuy = toBuy.filter(b => !same(b.name, v)); addToKitchen(v, true); toast(`${cap(v)} moved into We have`); return render(); }
    case 'copylist': { const txt = buyList().map(b => '• ' + b.name).join('\n'); try { navigator.clipboard.writeText(txt).then(() => toast('List copied'), () => toast(txt)); } catch { toast(txt); } return; }
    case 'addk': return addKitchen();
    case 'akt': ak.pend.has(v) ? ak.pend.delete(v) : ak.pend.add(v); return drawAddK();
    case 'akpasteopen': ak.paste = true; drawAddK(); return $('akp').focus();
    case 'akpaste': $('akp').value.split(/[\n,]+/).map(norm).filter(Boolean).forEach(n => ak.pend.add(n)); ak.paste = false; return drawAddK();
    case 'akgo': { const n = ak.pend.size; ak.pend.forEach(x => addToKitchen(x, true)); if ([...ak.pend].filter(x => BOX.includes(x)).length >= 5) boxWeek = weekKey(); save(); $('layer').innerHTML = ''; if (n) toast(`${n} added to the Kitchen`); return render(); }
    case 'akclose': $('layer').innerHTML = ''; return render();
    case 'settings': return settings();
    case 'me': me = v; save(); render(); return settings();
    case 'usual': usual = v; st.eater = v; save(); render(); return settings();
    case 'reset': try { Object.keys(localStorage).filter(k => k.startsWith(K)).forEach(k => localStorage.removeItem(k)); } catch {} location.reload(); return;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset?.sk) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') { const s = document.querySelector('#needsheet, #ingsheet'); if (s) return s.remove(); if ($('layer').innerHTML) closeLayer(); }
});
if (cooking && !byId(cooking.id)) cooking = null;
render();
</script>
