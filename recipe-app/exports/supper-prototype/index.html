function audio() {

// A sustained sine "bell" with optional pitch scoop, slow attack, held body and gentle tremolo.

"text": "Halve each piece lengthways. Make shallow cuts across the flesh without going through the skin, then press gently with the back of a knife to flatten it into an eel-like fillet.", "timer_min": null, "video_s": 16, "uses": ["aubergine"]}, {"text": "Heat 1 tbsp oil in a large frying pan over medium-high (7). Lay the aubergine in skin-side down and cook until lightly browned.", "timer_min": null, "video_s": 20, "uses": ["vegetable oil", "aubergine"]}, {"text": "Turn the pieces over and cook until the flesh is golden. A little char is no harm.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Turn the heat to medium (5-6). Pour in the sauce and simmer, turning the aubergine halfway, until the sauce has reduced to a sticky glaze that coats it.", "timer_min": null, "video_s": 26, "uses": ["aubergine", "soy sauce", "mirin", "sugar", "cornflour", "water"]}, {"text": "Lay it over a bowl of rice and scatter with furikake and chopped spring onions. Eat while hot.", "timer_min": null, "video_s": 29, "uses": ["rice", "furikake", "spring onion"]}], "cuisine": ["japanese"], "diet": ["pescatarian", "dairy-free"], "to_check": ["Frying times are not given by the creator, only \"lightly browned\", \"golden\" and \"mostly reduced\"; the 10 minutes steaming is from the website. Total time per website: 25 minutes.", "The caption lists the aubergine as \"1 large Asian eggplant\"; the website cuts it into 6-inch (15 cm) lengths. The video shows it flattened and the website adds scoring, which I have followed.", "\"Dark soy sauce\" and \"light soy sauce\" are both listed as \"soy sauce\" in the ingredient names.", "Furikake and spring onion amounts are not given."], "notes": ["Leave out the fish sauce for a vegan version; check the furikake too, as many contain bonito or other fish.", "A little shichimi togarashi or a soft egg on top would not be out of place."]}, {"id": "baked-curd-cheese-casserole", "title": "Baked curd cheese casserole", "code": "DVbI3SgDMBz", "creator": "@kristina_pesik", "creator_name": "Кристина Песик", "source_url": "https://www.instagram.com/p/DVbI3SgDMBz/", "total_min": 75, "servings": null, "course": "dessert", "mood": ["comforting", "something special"], "larder": "mixed", "perishables": ["quark", "cream cheese", "single cream"], "seasons": ["all"], "ingredients_canonical": ["quark", "cream cheese", "single cream", "sugar", "eggs", "cornflour", "vanilla extract", "lime"], "contains_meat": false, "status": "needs_checking", "intro": "Somewhere between a baked cheesecake and a set custard: soft, creamy and only just sweet. Everything goes into one bowl and is blended smooth, and it is better still the next morning, cold from the fridge or warmed a slice at a time.", "ingredients": [{"text": "655 g curd cheese, 6% fat (Russian tvorog; quark is the closest UK match)"}, {"text": "280 g cream cheese"}, {"text": "355 ml cream, 20% fat (single cream is the nearest)"}, {"text": "180 g sugar"}, {"text": "260 g eggs (about 5 large)"}, {"text": "75 g cornflour"}, {"text": "Vanilla extract, to taste (amount not given)"}, {"text": "Lime zest, to taste (amount not given)"}], "steps": [{"text": "Heat the oven to 160°C fan and line a baking dish with baking paper.", "timer_min": null, "video_s": 42, "uses": []}, {"text": "Tip the curd cheese, cream cheese and cream into a large bowl and blend until completely smooth, with no lumps of curd left.", "timer_min": null, "video_s": 23, "uses": ["quark", "cream cheese", "single cream"]}, {"text": "Add the sugar and eggs, then the vanilla and finely grated lime zest, tasting as you go if you like.", "timer_min": null, "video_s": 31, "uses": ["sugar", "eggs", "vanilla extract", "lime"]}, {"text": "Sift or sprinkle in the cornflour (it holds the casserole together) and blend again until the batter is smooth and pourable.", "timer_min": null, "video_s": 36, "uses": ["cornflour"]}, {"text": "Pour the batter into the lined dish and bake for about 1 hour, until the top is a good golden brown and the middle no longer wobbles when you nudge the dish. Ovens vary, so go by the look of it.", "timer_min": 60, "video_s": 45, "uses": []}, {"text": "Take it out and leave it to cool a little before cutting. Eat it warm, or chill it overnight and warm a slice the next morning.", "timer_min": null, "video_s": 48, "uses": []}], "cuisine": ["russian"], "diet": ["pescatarian", "vegetarian", "gluten-free"], "to_check": ["Oven: caption says 180°C, top and bottom heat (conventional), about 1 hour. Converted to 160°C fan (conventional minus 20).", "Dish size and depth are not stated; the video shows a rectangular dish. Servings are not given.", "Vanilla and lime zest are \"to taste\" in the original, with no amount.", "Eggs are given as 260 g, \"about 5\" in the caption; five large eggs is an estimate.", "\"Cream 20%\" is a Russian grade; single cream (about 18%) is the closest everyday UK cream.", "prep_min 15 is an estimate; the creator gives no prep time.", "Translated from Russian."], "notes": ["The creator likes it best after a night in the fridge, a slice cut and warmed for breakfast.", "Curd cheese (tvorog) is drier and more crumbly than UK cottage cheese. If you can only find cottage cheese, drain it well and blend it first; this is a swap, not what the creator used."]}, {"id": "basque-cheesecake", "title": "Basque cheesecake", "code": "C2hgy5JPBU7", "creator": "@soohyunlees", "creator_name": "Soohyun Lee", "source_url": "https://www.instagram.com/p/C2hgy5JPBU7/", "total_min": null, "servings": null, "course": "dessert", "mood": ["comforting", "something special"], "larder": "mixed", "perishables": ["cream cheese", "whipping cream", "eggs"], "seasons": ["all"], "ingredients_canonical": ["cream cheese", "sugar", "vanilla extract", "cornflour", "salt", "eggs", "whipping cream"], "contains_meat": false, "status": "ok", "intro": "A cheesecake with no base to blind-bake and no water bath, just a hot oven and a deeply browned top over a custard the colour of butter. It is better after a night or two in the fridge, so make it the day before you want it.", "ingredients": [{"text": "650 g cream cheese (block), cut into cubes, at room temperature"}, {"text": "195 g caster sugar"}, {"text": "1 tsp vanilla extract (optional)"}, {"text": "4 g cornflour"}, {"text": "2 g salt"}, {"text": "180 g eggs, at room temperature"}, {"text": "250 ml whipping cream, at room temperature"}, {"text": "Baking parchment, for lining a 20 cm cake tin"}], "steps": [{"text": "Set the oven to 220°C fan. Line a 20 cm cake tin with baking parchment, letting it stand a little above the rim.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Put the 650 g cream cheese cubes, 195 g sugar, 1 tsp vanilla, 4 g cornflour and 2 g salt into a food processor. Blend on a low speed until smooth, stopping to scrape down the sides and bottom now and then so nothing hides. (An even mixture is what keeps the cake smooth.)", "timer_min": null, "video_s": null, "uses": ["cream cheese", "sugar", "vanilla extract", "cornflour", "salt"]}, {"text": "Pour in the 180 g eggs and mix on low until completely combined.", "timer_min": null, "video_s": null, "uses": ["eggs"]}, {"text": "Pour in the 250 ml whipping cream and mix slowly until the batter is well combined and pourable.", "timer_min": null, "video_s": null, "uses": ["whipping cream"]}, {"text": "Pour the batter through a fine sieve into the lined tin, to catch any lumps.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Tap the tin on the work surface a few times to knock out the air bubbles.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Bake at 210°C fan for 23-25 minutes. It is ready when the top is deep brown and the centre still wobbles like set jelly when you nudge the tin.", "timer_min": 25, "video_s": null, "uses": []}, {"text": "Leave the cake in its tin on a wire rack until it reaches room temperature.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Cover and chill overnight. Lift out by the parchment, cut into wedges and eat cold, with a fork and no ceremony.", "timer_min": null, "video_s": null, "uses": []}], "cuisine": ["spanish"], "diet": ["pescatarian", "vegetarian", "gluten-free"], "to_check": ["Oven temperatures conflict inside the caption: step 1 says preheat to 240C, step 4 says bake at 230C. I have used the conversions of both as written (240C becomes 220°C fan, 230C becomes 210°C fan), assuming the creator's figures are conventional, not fan. If your oven runs hot, the top may darken faster than the 23-25 min suggests; watch it.", "8 inch cake pan converted to 20 cm.", "250 g whipping cream given by weight; I have written 250 ml (an estimate, as cream is slightly lighter than water).", "180 g eggs is about 3 medium eggs (estimate); weigh them out after beating.", "Servings not given. Prep and total times are not given; prep_min is an estimate, total_min left blank because of the overnight chill.", "Cornflour is gluten-free by itself; check the label of the cream cheese and vanilla if gluten matters.", "No speech in the video; everything comes from the caption and frames."], "notes": ["No food processor: the creator says it can be made by hand or in a stand mixer, as long as everything is at room temperature.", "It keeps improving in the fridge for a couple of days.", "Serve with strong black coffee."]}, {"id": "brie-and-pear-filo-tart", "title": "Brie and pear filo tart", "code": "CzUFNXjoJ_K", "creator": "@guinda.guindilla", "creator_name": "Clara / Recetas & Gastronomía", "source_url": "https://www.instagram.com/p/CzUFNXjoJ_K/", "total_min": 65, "servings": null, "course": "lunch", "mood": ["something special", "comforting"], "larder": "mixed", "perishables": ["brie", "pear", "thyme"], "seasons": ["autumn", "winter"], "ingredients_canonical": ["filo pastry", "brie", "pear", "butter", "eggs", "single cream", "salt", "black pepper", "thyme", "honey"], "contains_meat": false, "status": "needs_checking", "intro": "Sheets of filo folded into accordions and stood on end in a tray, with slices of soft cheese and pear tucked between the folds, set with a savoury custard. It should be eaten soon after baking, while the pastry is crisp, and a thread of honey over the top finishes it.", "ingredients": [{"text": "1 packet filo pastry (weight and sheet count not given)"}, {"text": "About 10 slices of brie or camembert-style cheese (weight not given)"}, {"text": "1 Conference pear"}, {"text": "20 g butter, melted"}, {"text": "2 eggs"}, {"text": "200 ml cooking cream (or rice or oat cream)"}, {"text": "Salt and black pepper, to taste"}, {"text": "A few fresh thyme leaves (amount not given)"}, {"text": "Honey (or agave or maple syrup), to taste"}], "steps": [{"text": "Set the oven to 180°C fan (the caption says to preheat for about 15 minutes).", "timer_min": 15, "video_s": null, "uses": []}, {"text": "Take the filo sheets two at a time and fold each pair concertina-style into an accordion.", "timer_min": null, "video_s": 9, "uses": ["filo pastry"]}, {"text": "Stand the folded filo on end in a baking tray lined with baking paper, packed close together so they hold each other upright. A tray that fits snugly works best.", "timer_min": null, "video_s": 13, "uses": ["filo pastry"]}, {"text": "Brush the filo with the melted butter.", "timer_min": null, "video_s": null, "uses": ["butter"]}, {"text": "Slice the cheese and the pear thinly, so that the slices fit between the folds of pastry.", "timer_min": null, "video_s": null, "uses": ["brie", "pear"]}, {"text": "Tuck the cheese and pear slices alternately into the folds, spreading them evenly over the tray.", "timer_min": null, "video_s": 25, "uses": ["brie", "pear"]}, {"text": "Beat the 2 eggs with the cream and season with salt and pepper. Pour this over the tart, spreading it so that it soaks in everywhere.", "timer_min": null, "video_s": 29, "uses": ["eggs", "single cream", "salt", "black pepper"]}, {"text": "Scatter over the thyme leaves.", "timer_min": null, "video_s": null, "uses": ["thyme"]}, {"text": "Bake at 160°C fan for about 40 minutes, until the custard is set and the filo is deep golden.", "timer_min": 40, "video_s": null, "uses": []}, {"text": "Cool the tray on a wire rack. Finish with a thin thread of honey and eat while it is still crisp.", "timer_min": null, "video_s": null, "uses": ["honey"]}], "cuisine": ["spanish"], "diet": ["pescatarian", "vegetarian"], "to_check": ["Missing quantities: filo packet weight or number of sheets, cheese weight (only \"about 10 slices\"), thyme, honey (to taste) and the size of the baking tray.", "Oven temperatures: the caption says preheat to 200 degrees and bake at 180; converted to 180°C fan and 160°C fan, assuming the creator's figures are conventional. Spanish ovens are often fan-assisted, so check how fast it browns.", "Cooking cream (nata para cocinar, usually about 18-20% fat) is recorded as single cream, which is the nearest UK equivalent; this is a substitution.", "Eggs written \"huevos 00\" in the caption; I have taken it as plain eggs, size not given.", "When the thyme goes on is not stated; I have scattered it on top before baking, which is a guess.", "Servings not given; prep and total times are estimates (cook time 40 min is given).", "The video says the temperature and time are in the description; they are in the caption (see above)."], "notes": ["The creator used Coronat de Mascla Perol, a Catalan cheese, with the pear (from the transcript); brie or camembert is the suggestion in the caption.", "Pear can be swapped for figs when they are in season, or for apple.", "It is a tart to eat straight away, because the filo softens quickly."]}, {"id": "broccolini-beans", "title": "Broccolini beans with tinned fish", "code": "DHdyddgRAs4", "creator": "@justine_snacks", "creator_name": "Justine Doiron", "source_url": "https://www.instagram.com/p/DHdyddgRAs4/", "total_min": 750, "servings": 4, "course": "main", "mood": ["comforting", "warming"], "larder": "mixed", "perishables": ["broccolini", "parsley"], "seasons": ["all"], "ingredients_canonical": ["dried white beans", "salt", "olive oil", "onion", "lemon", "garlic", "water", "broccolini", "calabrian chillies", "anchovies", "fennel seeds", "oregano", "black pepper", "tinned fish", "parsley", "bread"], "contains_meat": false, "status": "needs_checking", "intro": "Think spaghetti aglio e olio with the pasta swapped for creamy white beans, and a pile of finely chopped broccolini cooked down into a sauce. A good use for the tin of fish at the back of the cupboard, and for a heel of crusty bread.", "ingredients": [{"text": "225 g dried white beans (or drained tinned beans; amount not given)"}, {"text": "2 tsp flaky kosher salt, for the soak"}, {"text": "1 tbsp flaky kosher salt, for the pot"}, {"text": "60 ml extra-virgin olive oil"}, {"text": "1 small yellow onion (about 140 g)"}, {"text": "1 small lemon (about 55 g)"}, {"text": "5 garlic cloves"}, {"text": "1,400 ml water"}, {"text": "225 g broccolini (the ingredient list says 340 g; see To check)"}, {"text": "6 garlic cloves"}, {"text": "4 Calabrian chillies"}, {"text": "120 ml extra-virgin olive oil (the oil from the tin of fish, topped up to 120 ml, works too)"}, {"text": "4 flat anchovy fillets"}, {"text": "1 tsp fennel seeds"}, {"text": "1 tsp dried oregano"}, {"text": "½ tsp flaky kosher salt, and freshly ground black pepper"}, {"text": "1 tin (120 g) mackerel, anchovies or sardines"}, {"text": "1 lemon"}, {"text": "45 g flat-leaf parsley, chopped"}, {"text": "Crusty bread, to serve"}], "steps": [{"text": "Put the dried beans in a large bowl, cover with water by at least 5 cm and stir in the 2 tsp salt. Leave to soak for 6 to 24 hours (the longer they soak, the quicker they cook). Skip to step 8 if you are using tinned beans.", "timer_min": null, "video_s": null, "uses": ["dried white beans", "water", "salt"]}, {"text": "Set a large pot over a medium (5–6) heat and pour in 60 ml olive oil, enough to coat the base. Let it warm for a few minutes.", "timer_min": null, "video_s": null, "uses": ["olive oil"]}, {"text": "Peel and halve the onion, leaving the root on. Halve the small lemon lengthways and peel 5 garlic cloves. Lay the onion, lemon and garlic in the oil, cut sides down, and sear for 6–8 minutes until charred, then turn.", "timer_min": 8, "video_s": null, "uses": ["onion", "lemon", "garlic"]}, {"text": "Drain the beans and add them to the pot with 1 tbsp salt and 1,400 ml water. Bring to a simmer, cover and cook for 45 minutes to 1 hour.", "timer_min": 60, "video_s": null, "uses": ["dried white beans", "salt", "water"]}, {"text": "From 45 minutes on, taste 2 or 3 beans (they can cook unevenly) until they are creamy and tender right through.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Strain off most of the broth, leaving about 120 ml in the pot with the beans. Bin the lemon and keep the onion and garlic with the beans. Save the rest of the broth: it makes a fine stock. Set the pot aside.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Chop 225 g of broccolini very finely. Slice 6 garlic cloves and 4 Calabrian chillies thinly and set aside.", "timer_min": null, "video_s": null, "uses": ["broccolini", "garlic", "calabrian chillies"]}, {"text": "Warm 120 ml olive oil in a large frying pan over a medium (5–6) heat. If you are using the oil from your tin of fish, pour that in first and top up with olive oil to 120 ml. Add 4 anchovy fillets, 1 tsp fennel seeds and 1 tsp oregano and stir for 30–60 seconds, until the anchovies have melted into the oil.", "timer_min": 1, "video_s": 28, "uses": ["olive oil", "anchovies", "fennel seeds", "oregano"]}, {"text": "Add the garlic and chillies and let the oil simmer for 3–4 minutes, until the edges of the garlic turn golden.", "timer_min": 4, "video_s": null, "uses": ["garlic", "calabrian chillies"]}, {"text": "Add the broccolini and stir to coat. Cook for 6–8 minutes with ½ tsp salt and plenty of black pepper, until it has wilted down to a rough, glossy sauce.", "timer_min": 8, "video_s": 35, "uses": ["broccolini", "salt", "black pepper"]}, {"text": "Tip in everything from the bean pot, onion, garlic and broth included (or drained tinned beans), and stir until the beans are well coated.", "timer_min": null, "video_s": 44, "uses": ["dried white beans", "onion", "garlic"]}, {"text": "Break in the tin of fish and stir, breaking it into small pieces. Squeeze in the juice of half a lemon.", "timer_min": null, "video_s": null, "uses": ["tinned fish", "lemon"]}, {"text": "Simmer uncovered for 5–6 minutes, until thick with a little oil pooling at the edges.", "timer_min": 6, "video_s": null, "uses": []}, {"text": "Taste and add salt, pepper and lemon juice as needed, then stir in 45 g chopped parsley. Eat straight away with crusty bread.", "timer_min": null, "video_s": 48, "uses": ["parsley", "bread", "salt", "black pepper", "lemon"]}], "cuisine": ["italian", "american"], "diet": ["pescatarian", "dairy-free"], "to_check": ["Broccolini: the ingredient list says 3/4 lb (340 g), but step 7 says to chop 8 oz (225 g). Used 225 g; the page is inconsistent.", "Times: the page gives prep 12 hours (soak) and cook 30 minutes, but the beans alone take 45–60 minutes. Page figures are used in the frontmatter; the real cooking time is nearer 75 minutes (my estimate).", "Amount of tinned beans is not on the page (it refers to a note that was not captured). Two 400 g tins would be a reasonable guess, but check the original.", "Heat settings: the page says only medium for the pot and the pan; hob numbers are my translation to induction (5–6).", "Conversions from US: 1/2 lb = 225 g, 1/4 cup = 60 ml, 1/2 cup = 120 ml, 6 cups = 1,400 ml (1.42 l), 4.2 oz tin = 120 g, 1 cup chopped parsley (1.5 oz) = 45 g, 5 oz onion = 140 g, 2 oz lemon = 55 g, 2 inches = 5 cm.", "Salt: the page says \"1 tablespoon and 2 teaspoons\" divided between the soak and the pot; split taken from steps 1 and 4.", "The Reel is from the creator's \"not buying any more groceries\" series and says the website version has changes; the website was followed."], "notes": ["Mackerel, sardines or anchovies all work. The creator likes tins flavoured with lemon, capers, olives or chilli.", "Using the oil from the tin as the base oil is the creator's trick in the video: measure it out, then top up with olive oil to 120 ml.", "The page names Diamond Crystal, a light, flaky kosher salt. With fine table salt, use roughly half the quantity and taste as you go.", "Tinned beans make it a much quicker supper (skip steps 1 to 6)."]}, {"id": "charred-hispi-cabbage-with-whipped-miso-tofu", "title": "Charred hispi cabbage with whipped miso tofu", "code": "Cy2_tQfsh6_", "creator": "@christinasots", "creator_name": "Christina Soteriou", "source_url": "https://www.instagram.com/p/Cy2_tQfsh6_/", "total_min": 30, "servings": 2, "course": "main", "mood": ["comforting", "crunchy"], "larder": "fresh", "perishables": ["hispi cabbage", "silken tofu", "chives"], "seasons": ["autumn", "winter"], "ingredients_canonical": ["cabbage", "sesame oil", "olive oil", "salt", "black pepper", "white miso", "tahini", "rice wine vinegar", "silken tofu", "chives", "chilli oil", "sesame seeds"], "contains_meat": false, "status": "needs_checking", "intro": "Cabbage wedges roasted hard until their edges blacken, then covered to steam until soft and buttery inside. They sit on a cloud of whipped miso tofu with sesame chives and a little crispy chilli oil. Serve with rice and it is a full supper.", "ingredients": [{"text": "1 hispi cabbage"}, {"text": "Olive oil, for rubbing (amount not given)"}, {"text": "Salt and black pepper"}, {"text": "1 tbsp sesame oil"}, {"text": "1 tsp flaky sea salt (use less if using table salt)"}, {"text": "1/2 tsp white miso"}, {"text": "1 tsp tahini"}, {"text": "1 tsp rice wine vinegar"}, {"text": "300 g silken tofu, well drained"}, {"text": "10 g chives"}, {"text": "1–2 tbsp crispy chilli oil"}, {"text": "2 tbsp toasted sesame seeds (black and white)"}, {"text": "Rice, to serve (amount not given)"}], "steps": [{"text": "Heat the oven to 200°C fan. Cut the cabbage into 4 wedges, through the core so they hold together.", "timer_min": null, "video_s": 12, "uses": ["cabbage"]}, {"text": "Rub the wedges all over with olive oil, salt and pepper, then lay them on a baking sheet.", "timer_min": null, "video_s": 12, "uses": ["cabbage", "olive oil", "salt", "black pepper"]}, {"text": "Roast uncovered for 15 minutes, until the edges are charred and crisp.", "timer_min": 15, "video_s": 15, "uses": ["cabbage"]}, {"text": "Cover the tray with foil and turn the oven down to 180°C fan. Return it for a further 10–15 minutes, until a toothpick slides easily through the thickest part.", "timer_min": 15, "video_s": 20, "uses": ["cabbage"]}, {"text": "Meanwhile, blend 1 tbsp of sesame oil, 1 tsp of flaky salt, 1/2 tsp of white miso, 1 tsp of tahini, 1 tsp of rice wine vinegar and 300 g of well-drained silken tofu until perfectly smooth. Chill in the fridge to set a little.", "timer_min": null, "video_s": 22, "uses": ["sesame oil", "salt", "white miso", "tahini", "rice wine vinegar", "silken tofu"]}, {"text": "Chop the chives finely and stir them into a bowl with 2 tbsp of sesame seeds and a pinch of salt and pepper.", "timer_min": null, "video_s": null, "uses": ["chives", "sesame seeds", "salt", "black pepper"]}, {"text": "Spread most of the whipped tofu over a large plate and set the cabbage on top. Spoon over the remaining tofu, drizzle with 1–2 tbsp of crispy chilli oil and scatter with the sesame chives. Serve with rice.", "timer_min": null, "video_s": 31, "uses": ["silken tofu", "cabbage", "chilli oil", "chives", "sesame seeds"]}], "cuisine": ["fusion"], "diet": ["vegan", "vegetarian", "pescatarian", "dairy-free"], "to_check": ["Oven temperatures: caption gives 220°C then 200°C (conventional); converted to fan by subtracting 20, giving 200°C fan then 180°C fan.", "Olive oil amount not given (caption lists sesame oil only, but the method uses olive oil for the cabbage). Salt and pepper for the cabbage and for the chives are \"to taste\".", "The caption's 1 tsp salt appears to be for the whipped tofu; this is an inference.", "Rice amount not given. Prep time not given; 30 min is the total from the caption."], "notes": ["Pat the tofu well, or it will make the whip watery.", "No blender: mash the tofu through a sieve and beat in the other ingredients, though it will be less smooth.", "Fish or veg swap: not needed, this is already vegan."]}, {"id": "chilli-peanut-crispy-rice-salad-with-honey-soy-salmon", "title": "Chilli peanut crispy rice salad with honey soy salmon", "code": "DH4caL3y_uD", "creator": "@cookwithauds", "creator_name": "Audrey Rogers", "source_url": "https://www.instagram.com/p/DH4caL3y_uD/", "total_min": null, "servings": null, "course": "main", "mood": ["crunchy", "fresh & green"], "larder": "fresh", "perishables": ["salmon", "cucumber", "avocado", "coriander"], "seasons": ["spring", "summer"], "ingredients_canonical": ["rice", "white vinegar", "sesame oil", "sugar", "chilli oil", "salmon", "soy sauce", "honey", "onion powder", "garlic powder", "salt", "black pepper", "peanut butter", "cucumber", "edamame", "spring onion", "coriander", "avocado", "peanuts"], "contains_meat": false, "status": "needs_checking", "intro": "Day-old rice, dressed and baked until it shatters, then tossed through a green, crunchy salad with a creamy peanut dressing. Honey soy salmon sits on top. A good way to use up cold rice, and a dish that rewards being eaten while the rice is still crisp.", "ingredients": [{"text": "285 g day-old jasmine rice (cooked)"}, {"text": "30 ml white vinegar"}, {"text": "1 tsp sesame oil"}, {"text": "1 tbsp sugar"}, {"text": "60 ml chilli oil with the crispy bits (fried chilli in oil)"}, {"text": "450 g salmon fillet, cut into cubes"}, {"text": "60 ml soy sauce"}, {"text": "2 tbsp honey"}, {"text": "1 tsp sesame oil"}, {"text": "1 tsp onion powder"}, {"text": "1 tsp garlic powder"}, {"text": "1/2 tsp salt"}, {"text": "1 tsp black pepper"}, {"text": "80 ml soy sauce"}, {"text": "1 heaping tbsp honey"}, {"text": "1 heaping tbsp creamy peanut butter (about 30 g)"}, {"text": "1 tbsp chilli oil with the crispy bits"}, {"text": "30 ml white vinegar"}, {"text": "1 tsp onion powder"}, {"text": "1 tsp garlic powder"}, {"text": "1.5 large cucumbers, diced and patted dry (weight not given)"}, {"text": "150 g edamame beans"}, {"text": "30 g spring onions, chopped"}, {"text": "15 g coriander, chopped"}, {"text": "1 large avocado, cubed, sprinkled with salt and black pepper"}, {"text": "Peanuts, a handful (amount not given)"}], "steps": [{"text": "Heat the oven to 185°C fan. Stir the rice with 30 ml of white vinegar, 1 tsp of sesame oil, 1 tbsp of sugar and 60 ml of chilli oil until every grain is coated.", "timer_min": null, "video_s": null, "uses": ["rice", "white vinegar", "sesame oil", "sugar", "chilli oil"]}, {"text": "Spread the rice over a baking tray and bake for 40 minutes, stirring every 10 minutes, until deep golden and crisp.", "timer_min": 40, "video_s": null, "uses": ["rice"]}, {"text": "Meanwhile, put the cubed salmon in a bowl with 60 ml of soy sauce, 2 tbsp of honey, 1 tsp of sesame oil, 1 tsp each of onion powder and garlic powder, 1/2 tsp of salt and 1 tsp of black pepper. Turn gently and leave for at least 10 minutes.", "timer_min": 10, "video_s": null, "uses": ["salmon", "soy sauce", "honey", "sesame oil", "onion powder", "garlic powder", "salt", "black pepper"]}, {"text": "Air fry the salmon at 185°C fan for 10 minutes, until the edges are caramelised and the flesh flakes.", "timer_min": 10, "video_s": null, "uses": ["salmon"]}, {"text": "Blend 80 ml of soy sauce, 1 heaping tbsp of honey, 1 heaping tbsp of peanut butter, 1 tbsp of chilli oil, 30 ml of white vinegar and 1 tsp each of onion powder and garlic powder until smooth and creamy.", "timer_min": null, "video_s": null, "uses": ["soy sauce", "honey", "peanut butter", "chilli oil", "white vinegar", "onion powder", "garlic powder"]}, {"text": "Toss the cucumber, edamame, spring onions, coriander and avocado together in a large bowl. Add a handful of peanuts.", "timer_min": null, "video_s": null, "uses": ["cucumber", "edamame", "spring onion", "coriander", "avocado", "black pepper", "salt", "peanuts"]}, {"text": "Fold in the crispy rice and as much dressing as you like, then top with the salmon. Eat straight away, while the rice still crackles.", "timer_min": null, "video_s": null, "uses": ["rice", "salmon"]}], "cuisine": ["fusion"], "diet": ["pescatarian", "dairy-free"], "to_check": ["No speech (music only), so the caption is the only source. The video also has no spoken method.", "Oven and air fryer temperatures: source gives 400°F for both. Converted as 400°F to about 205°C, minus 20 for fan, rounded to 185°C fan. This is an estimate; an air fryer may want 180–200°C.", "Assembly is not described in the caption; the order of combining above is a reasonable guess.", "Cooked rice weight is converted from 1.5 cups at about 190 g per cup (estimate). Salmon 1 lb is about 450 g.", "Cucumber weight is not given (\"1.5 large\"). Edamame (1 cup, about 150 g), spring onion (1/3 cup, about 30 g) and coriander (1/4 cup, about 15 g) are estimates. Peanut butter 1 heaping tbsp is about 30 g (estimate).", "Peanut amount (\"handful\") not given. Servings and timings (apart from baking and air frying) not given.", "\"Fried chili in oil\" assumed to be chilli crisp / chilli oil with crispy bits."], "notes": ["Day-old rice matters: freshly cooked rice steams rather than crisps.", "Keep the dressing separate until the last minute and the rice will stay crunchy for longer.", "The salad makes a lunch on its own without the salmon, for a vegetarian version."]}, {"id": "cod-grenobloise", "title": "Cod grenobloise", "code": "DVbnwhjiExJ", "creator": "@adambyatt", "creator_name": "Adam Byatt", "source_url": "https://www.instagram.com/p/DVbnwhjiExJ/", "total_min": 55, "servings": 2, "course": "main", "mood": ["something special", "fresh & green"], "larder": "fresh", "perishables": ["cod", "cauliflower", "lemon", "parsley"], "seasons": ["autumn", "winter"], "ingredients_canonical": ["cod", "salt", "sugar", "butter", "lemon", "capers", "cornichons", "sourdough bread", "parsley", "white wine", "fish stock", "cauliflower", "olive oil"], "contains_meat": false, "status": "needs_checking", "intro": "A thick fillet of cod, briefly cured so it cooks up firm and seasoned through, sitting on a warm cauliflower purée under a brown butter dressing of capers, lemon and crisp bread. A restaurant dish that is more patience than difficulty, and well worth it for a dinner when you want something a little grand.", "ingredients": [{"text": "25 g table salt"}, {"text": "15 g caster sugar"}, {"text": "1 cod fillet (250 g), pin boned and trimmed (serves 2)"}, {"text": "100 g butter, in total (50 g for the croutons, 25 g for the braise, 25 g for the sauce)"}, {"text": "Olive oil, for frying and finishing (amount not given)"}, {"text": "100 ml fish stock (water or white wine if needed)"}, {"text": "1 lemon, segmented, juice kept"}, {"text": "20 g capers"}, {"text": "20 g cornichons, diced"}, {"text": "2 slices sourdough, cut into small dice"}, {"text": "20 g flat-leaf parsley, finely chopped"}, {"text": "20 ml white wine"}, {"text": "Warm cauliflower purée (amount and recipe not given)"}], "steps": [{"text": "Mix the 25 g salt and 15 g sugar together and coat the cod fillet evenly all over. Leave it for 12 minutes (the fish firms slightly and turns a little translucent).", "timer_min": 12, "video_s": 6, "uses": ["cod", "salt", "sugar"]}, {"text": "Rinse the cod under cold water and pat it very dry. Rest it skin-side down on a tray lined with a clean cloth, with a piece of paper laid lightly over the flesh. For the best skin and sear, leave it uncovered in the fridge overnight instead.", "timer_min": null, "video_s": null, "uses": ["cod"]}, {"text": "Heat the oven to 140°C fan.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Melt 50 g of the butter in a large frying pan over medium (5–6). Add the diced sourdough and toast, stirring, until golden. Lift the croutons out onto a plate to drain.", "timer_min": null, "video_s": null, "uses": ["butter", "sourdough bread"]}, {"text": "Wipe the pan if you need to, then heat a thin layer of olive oil over medium-high (7). Pat the cod dry again and lay it in flesh-side down, pressing it down gently with a weight or the back of a spatula for the first few seconds.", "timer_min": null, "video_s": 12, "uses": ["cod", "olive oil"]}, {"text": "Leave it alone for 6–8 minutes, until the underside is deep golden and the fish lifts away from the pan without sticking (it releases when it is ready).", "timer_min": 8, "video_s": 17, "uses": ["cod"]}, {"text": "Lift the cod out carefully into an ovenproof dish, skin-side down. Pour in 100 ml fish stock and dot with 25 g butter.", "timer_min": null, "video_s": 27, "uses": ["cod", "fish stock", "butter"]}, {"text": "Braise in the oven for 6–8 minutes, until the flesh is just opaque and flakes at the thickest part, then rest.", "timer_min": 8, "video_s": null, "uses": ["cod"]}, {"text": "In the same frying pan, cook the last 25 g of diced butter over medium (5–6) until golden brown and smelling of toasted nuts (a beurre noisette). Take the pan off the heat.", "timer_min": null, "video_s": 35, "uses": ["butter"]}, {"text": "Pour in the reserved lemon juice and 20 ml white wine, standing back as it spits, and shake the pan until the sauce turns glossy and emulsified.", "timer_min": null, "video_s": 43, "uses": ["lemon", "white wine"]}, {"text": "Stir in 20 g capers and 20 g diced cornichons, then the lemon segments and 20 g parsley.", "timer_min": null, "video_s": 46, "uses": ["capers", "cornichons", "lemon", "parsley"]}, {"text": "Fold in the croutons last, so they stay crisp, and season to taste.", "timer_min": null, "video_s": 60, "uses": ["sourdough bread", "salt"]}, {"text": "Spoon warm cauliflower purée onto warm plates. Peel the skin from the cod and set the fish on top, spoon the garnish over and finish with a thread of olive oil. Eat straight away while the croutons are still crackling.", "timer_min": null, "video_s": 70, "uses": ["cauliflower", "cod", "olive oil"]}], "cuisine": ["french"], "diet": ["pescatarian"], "to_check": ["The cauliflower purée is shown in the video and mentioned in the caption, but there is no recipe or quantity for it. Make your own, or use about 400 g cauliflower (an estimate, not from the source).", "Olive oil amount for frying and finishing is not given.", "Oven temperature: the caption says 160°C without saying fan or conventional. I treated it as conventional (160 minus 20 = 140°C fan); if the chef meant fan, use 160°C fan.", "Hob heat is not given for the croutons or noisette butter (caption says \"medium heat\" and \"medium-hot oil\"). Mapped to medium (5–6) and medium-high (7).", "Size of the sourdough dice, resting time after braising and the amount of lemon juice are not given.", "Caption says \"Serves two people\" with a single 250 g fillet; the caption also says to portion into 250 g pieces or individual servings. Treated as one 250 g fillet for 2.", "Prep, cook and total times are estimates (the cure takes 12 min; the optional overnight drying is not counted).", "The caption mentions no website recipe, so no web lookup was made."], "notes": ["The brief cure means the cod needs no extra salt in the pan. Drying it well, ideally overnight in the fridge, is what gives the crisp, golden finish.", "A fish stock cube made up with water will do, or use water or white wine if you have none.", "Any thick white fish fillet, such as haddock or hake, would take this garnish."]}, {"id": "cod-with-mustard-sauce-in-paper-boats", "title": "Cod with mustard sauce in paper boats", "code": "DPB6Q6SjBh5", "creator": "@just.homemade.food", "creator_name": "just me Artur", "source_url": "https://www.instagram.com/p/DPB6Q6SjBh5/", "total_min": null, "servings": null, "course": "main", "mood": ["light", "fresh & green"], "larder": "fresh", "perishables": ["cod", "courgette", "dill", "cherry tomatoes"], "seasons": ["all"], "ingredients_canonical": ["cod", "carrot", "courgette", "cherry tomatoes", "olive oil", "lime", "dill", "mustard"], "contains_meat": false, "status": "needs_checking", "intro": "Baking paper folded into a boat, tied at both ends with string, and filled with ribbons of carrot and courgette, a fillet of cod and a herby mustard sauce. The fish steams in its own juices, and opening the paper at the table is half the pleasure.", "ingredients": [{"text": "Cod fillet (amount not given)"}, {"text": "Carrot, cut into thin ribbons (amount not given)"}, {"text": "Courgette, cut into thin ribbons (amount not given)"}, {"text": "Cherry tomatoes (number not given)"}, {"text": "Olive oil (amount not given)"}, {"text": "Lime, juiced (amount not given)"}, {"text": "Fresh dill, chopped (amount not given)"}, {"text": "Mustard, wholegrain by the look of it (amount not given)"}, {"text": "Baking paper and kitchen string"}], "steps": [{"text": "Fold a large sheet of baking paper into a long boat shape, pinch the two ends together and tie each with string. Open the boat out so it holds its shape.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Drizzle a little olive oil in a zigzag along the bottom of the boat.", "timer_min": null, "video_s": null, "uses": ["olive oil"]}, {"text": "Lay ribbons of carrot and courgette along the boat, then set the cod fillet on top.", "timer_min": null, "video_s": null, "uses": ["carrot", "courgette", "cod"]}, {"text": "In a small bowl, stir together olive oil, a squeeze of lime juice, chopped dill and mustard until you have a loose green sauce.", "timer_min": null, "video_s": null, "uses": ["olive oil", "lime", "dill", "mustard"]}, {"text": "Spoon the sauce over the cod so it is covered, then tuck a few cherry tomatoes in around the fish.", "timer_min": null, "video_s": null, "uses": ["cherry tomatoes"]}, {"text": "Cook the boat in an air fryer until the cod flakes easily with a fork and the tomatoes have split. Temperature and time are not given (see To check).", "timer_min": null, "video_s": null, "uses": []}, {"text": "Bring it to the table in its paper and open it up. Eat the cod with the vegetables and spoon the juices over, while it is still steaming.", "timer_min": null, "video_s": null, "uses": []}], "cuisine": [], "diet": ["pescatarian", "gluten-free", "dairy-free"], "to_check": ["No speech and the caption has no recipe, only credits: fish from @kreutzers.eu with @manu.ostner, air fryer from @ninja.deutschland, marked as advertising.", "No quantities, temperature, time or number of servings are given. An earlier pass reported \"17\" on the air fryer display; I could not confirm that on the contact sheet, so no time is stated.", "Sauce contents are read from the frames: olive oil, lime juice (the fruit looks like a lime), dill and a mustard that looks wholegrain. All guesses.", "Order of layers (carrot and courgette under the fish) and the vegetable cut are judged from the frames.", "The oven suggestion in Notes is mine, not the creator's."], "notes": ["The creator uses a Ninja air fryer; a baking tray in a fan oven would do the same job.", "A little more lime at the table sharpens the mustard."]}, {"id": "creamy-kabocha-pumpkin-soup", "title": "Creamy kabocha pumpkin soup", "code": "DDAItEoo_vi", "creator": "@yukiskitchen", "creator_name": "Yuki Gomi | Japanese Food & Recipes", "source_url": "https://www.instagram.com/p/DDAItEoo_vi/", "total_min": null, "servings": null, "course": "lunch", "mood": ["comforting", "warming"], "larder": "mixed", "perishables": ["silken tofu", "chives"], "seasons": ["autumn", "winter"], "ingredients_canonical": ["kabocha squash", "silken tofu", "water", "kombu", "miso", "mirin", "sake", "pumpkin seeds", "chives"], "contains_meat": false, "status": "needs_checking", "intro": "Kabocha, steamed until soft over a little water and a strip of kombu, then blended with silken tofu so the soup turns velvety without any cream. Miso, mirin and sake give it a gentle savoury sweetness, a good bowl for a cold evening once the pumpkin is in the shops.", "ingredients": [{"text": "700 g kabocha pumpkin, peeled, seeded and cut into chunks"}, {"text": "300 g silken tofu"}, {"text": "500 ml water"}, {"text": "1 piece kombu (about 5–8 cm)"}, {"text": "3 tbsp miso (the creator uses an organic miso; type not given)"}, {"text": "1 tbsp mirin"}, {"text": "1 tbsp sake"}, {"heading": "To finish"}, {"text": "Toasted pumpkin seeds (amount not given)"}, {"text": "Chives, finely chopped (amount not given)"}, {"text": "Crusty bread or rice, to serve (optional)"}], "steps": [{"text": "Scoop the seeds out of the kabocha, then cut it into rough chunks and trim off the skin. It is a bit of work, but worth it.", "timer_min": null, "video_s": 15, "uses": ["kabocha squash"]}, {"text": "Pour 500 ml water into a large pot and add the kombu (it lends the soup its savoury depth).", "timer_min": null, "video_s": 25, "uses": ["water", "kombu"]}, {"text": "Add the kabocha chunks, put the lid on and steam over a medium heat (5–6) until a cocktail stick slides in easily. Cooking time is not given.", "timer_min": null, "video_s": 30, "uses": ["kabocha squash"]}, {"text": "While the kabocha cooks, blend the silken tofu until smooth and creamy. Set it aside.", "timer_min": null, "video_s": 34, "uses": ["silken tofu"]}, {"text": "Lift out the kombu. Blend the kabocha, with its cooking water, to a smooth soup.", "timer_min": null, "video_s": 43, "uses": ["kabocha squash", "kombu"]}, {"text": "Stir in 1 tbsp sake, 1 tbsp mirin and 3 tbsp miso.", "timer_min": null, "video_s": 46, "uses": ["sake", "mirin", "miso"]}, {"text": "Fold in the tofu cream until the soup looks glossy and even.", "timer_min": null, "video_s": 48, "uses": ["silken tofu"]}, {"text": "Ladle into bowls while warm and scatter with toasted pumpkin seeds and chopped chives. Eat with crusty bread or rice.", "timer_min": null, "video_s": 52, "uses": ["pumpkin seeds", "chives"]}], "cuisine": ["japanese"], "diet": ["vegan", "vegetarian", "pescatarian", "dairy-free"], "to_check": ["No cooking time for the kabocha: the creator says to steam until tender and test with a cocktail stick. Cubes of 2–3 cm usually take about 15–20 minutes (estimate).", "Heat setting (medium, 5–6) is an assumption; no heat is given.", "Whether the kabocha is blended with its cooking water is inferred; the caption just says \"blend the kabocha into a smooth soup\". Add water to loosen if it is too thick.", "No servings, and no amounts for the pumpkin seeds and chives.", "The miso type is not stated (the caption names a brand). Listed here as \"miso\".", "No website recipe link in the caption or post data, so none was looked up."], "notes": ["It keeps well in the fridge for a few days, reheated gently. The tofu may thicken it; loosen with a splash of water.", "Any miso will do, though a mild white miso keeps the colour bright."]}, {"id": "creamy-mushroom-and-miso-pasta", "title": "Creamy mushroom and miso pasta", "code": "DG004YSIeMK", "creator": "@deliciouslyella", "creator_name": "Deliciously Ella", "source_url": "https://www.instagram.com/p/DG004YSIeMK/", "total_min": 20, "servings": null, "course": "main", "mood": ["quick fix", "comforting"], "larder": "mixed", "perishables": ["chestnut mushrooms", "spinach", "chives"], "seasons": ["autumn", "winter"], "ingredients_canonical": ["pasta", "mushrooms", "dried mushrooms", "olive oil", "salt", "spinach", "chives", "black pepper", "garlic", "silken tofu", "brown rice miso", "lemon"], "contains_meat": false, "status": "ok", "intro": "A sauce of silken tofu, miso and soaked porcini blended until it turns velvety, then stirred through pasta, browned mushrooms and soft spinach. It is quick, savoury and wonderfully rich without a drop of cream, which makes it a good midweek supper.", "ingredients": [{"text": "300 g dried pasta"}, {"text": "600 g chestnut mushrooms, sliced"}, {"text": "20 g dried porcini mushrooms"}, {"text": "150 ml boiling water"}, {"text": "Olive oil, a drizzle"}, {"text": "A pinch of salt"}, {"text": "2 handfuls of spinach (about 60 g), finely sliced"}, {"text": "A small bunch of chives (amount not given), chopped"}, {"text": "2 garlic cloves"}, {"text": "300 g silken tofu"}, {"text": "2 tbsp brown rice miso paste"}, {"text": "Juice of ½ lemon"}, {"text": "Black pepper, several grinds"}, {"text": "Sea salt, to serve"}], "steps": [{"text": "Put the dried porcini in a bowl and cover with 150 ml boiling water. Leave for 10 minutes, until soft.", "timer_min": 10, "video_s": null, "uses": ["dried mushrooms", "water"]}, {"text": "Put the pasta on to cook in well-salted boiling water (heat 9) according to the packet. Drain it, keeping a mugful of the cooking water.", "timer_min": null, "video_s": null, "uses": ["pasta", "salt", "water"]}, {"text": "Meanwhile, set a large frying pan over medium-high (7) and add a drizzle of olive oil. Tip in the sliced chestnut mushrooms with a pinch of salt and cook for 5–10 minutes, until tender and starting to colour.", "timer_min": 10, "video_s": null, "uses": ["mushrooms", "olive oil", "salt"]}, {"text": "Tip the soaked porcini and their liquid into a blender with the garlic, tofu, miso and lemon juice. Blend until completely smooth, then season to taste.", "timer_min": null, "video_s": 2, "uses": ["dried mushrooms", "garlic", "silken tofu", "brown rice miso", "lemon"]}, {"text": "Add the drained pasta, the sauce, the spinach and the chives to the mushroom pan. Stir over the heat for about a minute, until the spinach wilts, loosening with a little of the reserved pasta water if it seems thick.", "timer_min": 1, "video_s": 6, "uses": ["pasta", "spinach", "chives"]}, {"text": "Serve in warm bowls with a little sea salt and plenty of black pepper.", "timer_min": null, "video_s": null, "uses": ["salt", "black pepper"]}], "cuisine": ["fusion"], "diet": ["vegan", "vegetarian", "pescatarian", "dairy-free"], "to_check": ["Servings are not given. Judging by 300 g pasta and 600 g mushrooms, it feeds about 3 to 4 (an estimate).", "\"2 handfuls of spinach\" and \"small bunch of chives\" have no weights; about 60 g spinach is an estimate.", "Caption says \"½ lemons\" and lists it with the sauce ingredients; I took it as the juice of half a lemon.", "Caption lists the garlic as \"2 cloves\" with no prep; they are blended raw.", "Prep, cook and total times: the caption claims 15 minutes; I added a little for slicing the mushrooms (estimate).", "Pasta water amount and the pack cooking time are not given.", "The caption points to the full recipe in the creator's app or at deliciouslyella.com; the website lookup failed (the recipe page was not reachable by fetch), so the caption is the top source."], "notes": ["Brown rice miso is darker and saltier than white miso, so taste before adding more salt.", "The sauce keeps for a day or two in the fridge; loosen with a splash of water when reheating."]}, {"id": "creamy-pesto-orzo-with-crispy-salmon", "title": "Creamy pesto orzo with crispy salmon", "code": "C8kHapDNLG3", "creator": "@samseats", "creator_name": "Sam Way", "source_url": "https://www.instagram.com/p/C8kHapDNLG3/", "total_min": 55, "servings": 4, "course": "main", "mood": ["something special", "comforting"], "larder": "fresh", "perishables": ["salmon", "spinach", "basil", "leek", "dill"], "seasons": ["spring", "summer", "autumn"], "ingredients_canonical": ["parmesan", "basil", "walnuts", "garlic", "spinach", "salt", "black pepper", "leek", "butter", "olive oil", "orzo", "stock", "salmon", "vegetable oil", "sour cream", "dill", "lemon"], "contains_meat": false, "status": "needs_checking", "intro": "Orzo cooked slowly with leeks and stock, then stirred through a bright green pesto of spinach, basil and toasted walnuts until it turns creamy and almost risotto-like. Salmon with a crackling skin sits on top. A dinner for two to share, or for four, that looks like far more effort than it is.", "ingredients": [{"text": "30 g parmesan, grated"}, {"text": "30 g basil leaves"}, {"text": "40 g walnuts, toasted"}, {"text": "1 garlic clove (leave it out if you are not sharing the dinner)"}, {"text": "130 g spinach"}, {"text": "Black pepper and sea salt, to season"}, {"text": "1 leek, finely chopped"}, {"text": "40 g unsalted butter"}, {"text": "1 tbsp olive oil"}, {"text": "2 medium garlic cloves, sliced"}, {"text": "Salt and pepper"}, {"text": "300 g orzo"}, {"text": "900 ml stock (type not given)"}, {"text": "4 salmon fillets, skin on (weight not given)"}, {"text": "Fine sea salt (amount not given)"}, {"text": "High-heat oil, for frying (amount not given)"}, {"text": "Sour cream (amount not given)"}, {"text": "Dill (amount not given)"}, {"text": "Lemon zest and juice (amount not given)"}], "steps": [{"text": "Set the salmon fillets on a rack over a baking tray and sprinkle both sides with fine sea salt. Leave them in the fridge until you are ready to cook (the salt draws out moisture, so the skin crisps).", "timer_min": null, "video_s": null, "uses": ["salmon", "salt"]}, {"text": "Toast the walnuts in a dry frying pan over medium (5–6) until golden and fragrant. Tip them onto a plate.", "timer_min": null, "video_s": null, "uses": ["walnuts"]}, {"text": "Blanch the spinach in boiling water (heat 9) for 20 seconds, then lift it into a bowl of iced water. Squeeze out as much water as you can once it is cold.", "timer_min": null, "video_s": null, "uses": ["spinach", "water"]}, {"text": "Blitz the parmesan, basil, walnuts, garlic, spinach, salt and pepper in a blender until smooth. Set aside.", "timer_min": null, "video_s": null, "uses": ["parmesan", "basil", "walnuts", "garlic", "spinach", "salt", "black pepper"]}, {"text": "In a wide lidded pan, cook the leek with the butter and olive oil over medium-high (7) for 5 minutes, until soft and just starting to caramelise. Add the sliced garlic towards the end.", "timer_min": 5, "video_s": null, "uses": ["leek", "butter", "olive oil", "garlic"]}, {"text": "Stir in the orzo and 900 ml stock and bring to a simmer. Cover and cook over low (2–3) for 15 minutes, stirring now and then, adding a splash of water halfway if it looks dry.", "timer_min": 15, "video_s": null, "uses": ["orzo", "stock", "water"]}, {"text": "Take the pan off the heat and stir in the pesto until the orzo is evenly green and creamy. Season to taste.", "timer_min": null, "video_s": null, "uses": ["salt", "black pepper"]}, {"text": "Take the salmon from the fridge and pat the skin dry.", "timer_min": null, "video_s": null, "uses": ["salmon"]}, {"text": "Heat a little high-heat oil in a frying pan over high (8–9). Lay the salmon in skin-side down and press down on each fillet for a few seconds so the skin stays flat.", "timer_min": null, "video_s": null, "uses": ["salmon", "vegetable oil"]}, {"text": "Turn the heat down to medium-high (7) and cook for 5 minutes, until the skin is crisp and brown. Flip and sear the flesh for 2 minutes, then set aside.", "timer_min": 5, "video_s": null, "uses": ["salmon"]}, {"text": "Spoon the orzo into bowls and set a salmon fillet on each. Add a dollop of sour cream, some chopped dill and a little lemon zest and juice, and eat while the skin is still crisp.", "timer_min": null, "video_s": null, "uses": ["orzo", "salmon", "sour cream", "dill", "lemon"]}], "cuisine": ["italian"], "diet": ["pescatarian"], "to_check": ["The transcript is only a spoken title, so the caption and the frames were the sources.", "Stock type is not given. Use vegetable or fish stock to keep it pescatarian; chicken stock would make it a meat recipe. I assumed vegetable stock; check for celery on the label.", "Salmon fillet weight, salt for the sal ": "250 g firm tofu (the creator used tomato-flavoured tofu)"}, {"text": "3 heaped tbsp nutritional yeast"}, {"text": "2 tbsp white miso"}, {"text": "A splash of water"}, {"text": "Olive oil (\"plenty\"; amount not given) and a pinch of salt"}, {"heading": "To serve"}, {"text": "More fresh basil"}, {"text": "Extra-virgin olive oil"}, {"text": "Toasted sourdough, or a cooked grain of your choice"}], "steps": [{"text": "Warm plenty of olive oil in a wide pan over a medium heat (5–6). Add the onion, garlic and a pinch of salt and cook until soft and fragrant.", "timer_min": null, "video_s": 10, "uses": ["onion", "garlic", "olive oil", "salt"]}, {"text": "Stir in the tomato puree, chopped tomatoes, butter beans and torn basil.", "timer_min": null, "video_s": 14, "uses": ["tomato puree", "tomatoes", "butter beans", "basil"]}, {"text": "Cook it all down until the tomatoes have collapsed and the sauce is sweet and jammy.", "timer_min": null, "video_s": 16, "uses": []}, {"text": "Spoon a couple of spoonfuls of the beans into a blender cup with the tofu, nutritional yeast, white miso and a splash of water, and blitz until smooth. (The tofu raises the protein and thickens the sauce without long simmering.)", "timer_min": null, "video_s": 19, "uses": ["firm tofu", "nutritional yeast", "white miso", "water"]}, {"text": "Stir the blended cream back into the pan and warm it through, tasting for salt.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Spoon into bowls, scatter with fresh basil and a drizzle of extra-virgin olive oil, and eat with toasted sourdough or a grain.", "timer_min": null, "video_s": 28, "uses": ["basil", "olive oil", "sourdough bread"]}], "cuisine": [], "diet": ["vegan", "vegetarian", "pescatarian", "dairy-free"], "to_check": ["The method is in a pinned comment on the post, but the creator's comments could not be retrieved (comments.json holds 15 other commenters, none from the creator, no pinned comment). The steps here come from the transcript tten here.", "Serves 2, per the caption. No prep time given; the creator says no longer than 20 minutes in total.", "No website recipe link in the caption, so none was looked up."], "notes": ["Good with a tomato and cucumber salad, or cut into small squares as part of a meze table.", "Eat it straight away; the filo softens as it cools."]}, {"id": "garlic-butter-halloumi-schnitzel", "title": "Garlic butter halloumi schnitzel", "code": "DFxzax_oWAS", "creator": "@amysheppardfood", "creator_name": "Amy Sheppard", "source_url": "https://www.instagram.com/p/DFxzax_oWAS/", "total_min": null, "servings": null, "course": "main", "mood": ["comforting", "crunchy"], "larder": "mixed", "perishables": ["halloumi"], "seasons": ["all"], "ingredients_canonical": ["halloumi", "eggs", "plain flour", "breadcrumbs", "vegetable oil", "butter", "garlic paste", "dried parsley", "salt", "black pepper", "water"], "contains_meat": false, "status": "needs_checking", "intro": "Halloumi soaked in boiling water turns pliable enough to be rolled thin, then crumbed and fried like a schnitzel. A store-cupboard garlic butter goes over the top, which makes it something of a vegetarian chicken Kiev. Good with chips at the weekend.", "ingredients": [{"text": "2 blocks halloumi (weight not given)"}, {"text": "Plain flour, for coating (amount not given)"}, {"text": "1 large egg, beaten"}, {"text": "Breadcrumbs, fresh or panko, a large handful (amount not given)"}, {"text": "Oil for frying (amount not given)"}, {"text": "60 g butter"}, {"text": "1 tsp garlic paste"}, {"text": "1 tsp dried parsley"}, {"text": "Salt and black pepper"}], "steps": [{"text": "Cut each block of halloumi carefully in half lengthways. Bring a pan of water to the boil and lower in the halloumi. Leave it to soak for 15 minutes, until soft and floppy.", "timer_min": 15, "video_s": 4, "uses": ["halloumi", "water"]}, {"text": "Lift out one piece at a time, leaving the rest in the water while you work, and lay it on a double sheet of kitchen paper. Cover with more paper and roll it out gently with a rolling pin until it is thin and about double the size.", "timer_min": null, "video_s": 7, "uses": ["halloumi"]}, {"text": "Leave the rolled halloumi to cool completely before you move it (it will tear if handled warm).", "timer_min": null, "video_s": null, "uses": ["halloumi"]}, {"text": "Roll each piece in flour and tap off the excess. Dip it in the beaten egg, then press it into the breadcrumbs, making sure both sides are covered. Repeat with the rest.", "timer_min": null, "video_s": 9, "uses": ["halloumi", "plain flour", "eggs", "breadcrumbs"]}, {"text": "Fry in oil in a large frying pan over a medium heat (5–6) for a couple of minutes on each side, until crisp and golden brown.", "timer_min": 4, "video_s": 11, "uses": ["halloumi", "vegetable oil"]}, {"text": "Put the butter, garlic paste and dried parsley in a microwave-safe bowl with a pinch of salt and pepper. Microwave until the butter has melted, then stir.", "timer_min": null, "video_s": 17, "uses": ["butter", "garlic paste", "dried parsley", "salt", "black pepper"]}, {"text": "Pour the garlic butter over the crispy halloumi and serve immediately, with chips.", "timer_min": null, "video_s": null, "uses": ["butter", "halloumi"]}], "cuisine": [], "diet": ["vegetarian", "pescatarian"], "to_check": ["Weight of halloumi not given (blocks vary, often 225 g). Flour, breadcrumb and frying oil amounts not given.", "Frying heat and time: \"a couple of minutes on each side\" from the caption; medium (5–6) is a suggestion for an induction hob, not from the source.", "The caption says \"cut carefully in half lengthways\" for 2 blocks but the method refers to \"halloumi quarters\" and makes 4 steaks, so each block probably gives two slices.", "Servings and prep time not given.", "No website recipe link in the caption; the full recipe is in the caption itself."], "notes": ["The creator says these can be cooked in an air fryer, but gives no settings.", "Wit d.", "timer_min": null, "video_s": 24, "uses": ["cabbage", "beetroot", "carrot", "celery", "parsley", "garlic"]}, {"text": "Pour 1 litre of water into a pan, add 1 tbsp coarse salt and 1 tbsp mustard powder, and bring to the boil (9).", "timer_min": null, "video_s": 24, "uses": ["water", "salt", "mustard powder"]}, {"text": "Pour the boiling brine straight over the vegetables until they are covered. Press them down under a small plate so nothing sits above the liquid, and cover with a lid.", "timer_min": null, "video_s": 34, "uses": []}, {"text": "Leave in a warm place for 3 days until the cabbage has soured and the brine has turned deep pink.", "timer_min": null, "video_s": 34, "uses": []}, {"text": "Eat the cabbage and beetroot chilled, as a sharp, crunchy side to rich or plain food.", "timer_min": null, "video_s": null, "uses": []}], "cuisine": ["eastern-european"], "diet": ["vegan", "vegetarian", "pescatarian", "gluten-free", "dairy-free"], "to_check": ["Garlic: it is spoken and shown in the video (a handful of cloves), but is missing from the caption, so no amount is known.", "Servings not given; total time left blank (3 days of fermenting). Prep time is \"10 minutes\" per the title line.", "\"Сельдерей\" is translated as celery; the video shows pale green chunks that look like celery stalks, not celeriac.", "The brine: the caption says 1 l water, 1 tbsp coarse salt, 1 tbsp mustard powder. Salt is given as a tablespoon (volume); a gram weight is not given.", "Storage and shelf life not given.", "Temperature of the \"warm place\" not given.", "The caption is in Russian; the transcript is auto-generated and partly garbled, so the caption wins where they differ."], "notes": ["The creator suggests making 2 litres of brine at once, so there is certainly enough to cover the vegetables.", "No vinegar is used; the sourness comes from fermenting.", "How long it keeps once ready, and whether it should go into the fridge, is not given. Refrigerating once soured is the usu dges, skins on.", "timer_min": null, "video_s": 3, "uses": []}, {"text": "Toss them in a bowl with olive oil, salt, black pepper, garlic, thyme and paprika (amounts not given; enough oil to coat them lightly).", "timer_min": null, "video_s": 5, "uses": ["sweet potato", "olive oil", "salt", "black pepper", "garlic", "thyme", "paprika"]}, {"text": "Roast for 40 minutes, until crisp at the edges and soft inside.", "timer_min": 40, "video_s": 7, "uses": []}, {"text": "While they roast, put the cooked cannellini beans in a bowl with olive oil, salt, black pepper, garlic, rosemary and a squeeze of lemon juice. Blend with a hand blender until smooth and creamy.", "timer_min": null, "video_s": 10, "uses": ["cannellini beans", "olive oil", "salt", "black pepper", "garlic", "rosemary", "lemon"]}, {"text": "Set a flat-bottomed pan over a medium-high (7) heat with a little olive oil and garlic, add the spinach and toss for a minute or two, until just wilted and glossy.", "timer_min": 2, "video_s": 17, "uses": ["spinach", "garlic", "olive oil"]}, {"text": "Spread the bean cream over a plate, lay the spinach on top and the sweet potatoes over that. Drizzle with honey, scatter with seeds and eat straight away while the potatoes are still crisp.", "timer_min": null, "video_s": 20, "uses": ["cannellini beans", "spinach", "sweet potato", "honey", "seeds"]}], "cuisine": ["italian"], "diet": ["pescatarian", "vegetarian", "dairy-free", "gluten-free"], "to_check": ["The only quantities in the whole post are the roasting time and temperature: \"40 minuti statico 220 gradi\" (static oven, 220°C). Converted to 200°C fan. Every ingredient amount is missing.", "Translated from Italian. The transcript is garbled around \"fagioli cannellini\"; the caption confirms cannellini.", "The \"semini\" (seeds) look like black sesame in the video; this is a guess, hence sesame under allergens.", "Beans look pre-cooked (tinned or jarred) in the video; this is not stated.", "Hob heat and spinach time are my estimates (the video shows a quick toss in a hot pan; no heat or time is given). Skins on for the sweet potatoes is read from the video."], "notes": ["The caption names \"spinacino croccante\" (crispy baby spinach), but the video shows the spinach sautéed with garlic and oil until wilted, so that is what is described here.", "A little olive oil over the bean cream before the potatoes go on looks right in the video."]}, {"id": "roasted-aubergine-dip", "title": "Roasted aubergine dip", "code": "DENj1ToRsJT", "creator": "@hungrypaprikas", "creator_name": "Amina Al-Saigh", "source_url": "https://www.instagram.com/p/DENj1ToRsJT/", "total_min": 70, "servings": 5, "course": "side", "mood": ["spicy", "light"], "larder": "mixed", "perishables": ["aubergine"], "seasons": ["summer", "autumn"], "ingredients_canonical": ["aubergine", "onion", "paprika", "chilli powder", "salt", "sugar", "tomato puree", "pomegranate molasses", "olive oil", "garlic"], "contains_meat": false, "status": "ok", "intro": "Cubed aubergine and onion left to melt together in olive oil, tomato and pomegranate molasses, then mashed into a sweet, tangy, faintly spicy dip. It does all the work in the oven, which makes it a sensible thing to have in the fridge when people are coming.", "ingredients": [{"text": "1 large aubergine"}, {"text": "1 onion"}, {"text": "1½ tsp paprika"}, {"text": "½ tsp chilli powder"}, {"text": "1 tsp salt"}, {"text": "1½ tsp sugar"}, {"text": "2 tbsp tomato puree"}, {"text": "1 tbsp pomegranate molasses"}, {"text": "120 ml olive oil"}, {"text": "3 garlic cloves"}], "steps": [{"text": "Heat the oven to 185°C fan. Wash the aubergine and peel it in alternate stripes, like a zebra, then cut it into small cubes.", "timer_min": null, "video_s": 26, "uses": ["aubergine"]}, {"text": "Slice the onion thinly.", "timer_min": null, "video_s": null, "uses": ["onion"]}, {"text": "In a large bowl, mix 1½ tsp of paprika, ½ tsp of chilli powder, 1 tsp of salt, 1½ tsp of sugar, 2 tbsp of tomato puree, 1 tbsp of pomegranate molasses, 120 ml of olive oil and the 3 crushed garlic cloves until smooth.", "timer_min": null, "video_s": null, "uses": ["paprika", "chilli powder", "salt", "sugar", "tomato puree", "pomegranate molasses", "olive oil", "garlic"]}, {"text": "Add the aubergine and onion and turn them until every piece is coated.", "timer_min": null, "video_s": 26, "uses": ["aubergine", "onion"]}, {"text": "Tip everything into a lidded oven dish or Dutch oven and bake, covered, for 1 hour, until the aubergine is very soft and mashes easily against the side with a fork. Give it longer if it is still firm.", "timer_min": 60, "video_s": null, "uses": ["aubergine", "onion"]}, {"text": "Mash with a fork to a chunky texture and taste for salt. Cool, then chill in the fridge.", "timer_min": null, "video_s": null, "uses": ["salt"]}, {"text": "Serve cold, or at room temperature, with a drizzle of olive oil and plenty of pita bread for scooping.", "timer_min": null, "video_s": null, "uses": ["olive oil"]}], "cuisine": ["middle-eastern"], "diet": ["vegan", "vegetarian", "pescatarian", "dairy-free", "gluten-free"], "to_check": ["Oven temperature: both caption and blog say 400°F. Converted as about 205°C, minus 20 for fan, rounded to 185°C fan (estimate).", "Olive oil: ½ cup converted to 120 ml.", "Aubergine size \"large\" is not weighed in the source.", "Blog gives 5 servings, 10 min prep and 1 hour cook; the caption does not.", "The blog title is \"Mediterranean Eggplant Dip\"; caption and blog ingredients and method agree."], "notes": ["The blog suggests garnishing with olive oil, parsley and walnuts, and serving with pita. Amounts for the garnish are not given.", "It keeps well in the fridge, and the flavours settle after a day.", "Fish or veg swap: not needed, this is already vegan."]}, {"id": "scarpaccia-with-pepper-and-onion", "title": "Scarpaccia with pepper and onion", "code": "C8kODErKIKh", "creator": "@recipesandplaces", "creator_name": "Francesca", "source_url": "https://www.instagram.com/p/C8kODErKIKh/", "total_min": 80, "servings": null, "course": "lunch", "mood": ["crunchy", "light"], "larder": "mixed", "perishables": ["red pepper"], "seasons": ["summer", "autumn"], "ingredients_canonical": ["plain flour", "polenta", "red onion", "red pepper", "water", "rosemary", "thyme", "salt", "black pepper", "olive oil"], "contains_meat": false, "status": "needs_checking", "intro": "A thin, crackling Italian tart, normally made with courgettes, here built almost entirely from sweet peppers and red onions with just enough flour to hold them together. Cut it into squares for a light lunch or a snack, warm or cooled.", "ingredients": [{"text": "220 g plain flour"}, {"text": "55 g fine polenta (cornmeal)"}, {"text": "5 small red onions"}, {"text": "860 g bell peppers (the page also says \"2 medium\"; see To check)"}, {"text": "190 ml water"}, {"text": "Dried rosemary and thyme, to taste"}, {"text": "Salt and black pepper, to taste"}, {"text": "Olive oil, to taste"}, {"text": "A little extra polenta, for sprinkling"}], "steps": [{"text": "Heat the oven to 200°C fan.", "timer_min": null, "video_s": null, "uses": []}, {"text": "Slice the 5 red onions thinly and cut the peppers into small strips.", "timer_min": null, "video_s": 10, "uses": ["red onion", "red pepper"]}, {"text": "Tip the onions and peppers into a large bowl with the dried herbs, salt, black pepper, 220 g plain flour and 55 g polenta, and mix.", "timer_min": null, "video_s": 14, "uses": ["red onion", "red pepper", "rosemary", "thyme", "salt", "black pepper", "plain flour", "polenta"]}, {"text": "Add 190 ml water a little at a time, stirring, until the mixture is thick. It will look like far more vegetable than batter and as if it will never hold together, which is exactly right.", "timer_min": null, "video_s": 20, "uses": ["water"]}, {"text": "Line a large baking tray (or two medium ones) with baking paper and rub the paper with olive oil.", "timer_min": null, "video_s": 22, "uses": ["olive oil"]}, {"text": "Spread the mixture over the paper and press it down thin and even (any thick patch will stay raw while the thin parts burn).", "timer_min": null, "video_s": 22, "uses": []}, {"text": "Drizzle with olive oil and sprinkle with a little polenta and salt.", "timer_min": null, "video_s": 25, "uses": ["olive oil", "polenta", "salt"]}, {"text": "Bake for 50–60 minutes, until deep golden on top. For a crisp base, move the tray to the bottom of the oven for the last 10 minutes, and lay a sheet of baking paper over the top if it darkens before the middle is cooked.", "timer_min": 60, "video_s": 28, "uses": []}, {"text": "Leave the tray to cool for 15 minutes before slicing (the top will still feel slightly soft under a finger and firms as it cools). Cut into squares and eat warm or at room temperature.", "timer_min": 15, "video_s": null, "uses": []}], "cuisine": ["italian"], "diet": ["vegan", "vegetarian", "pescatarian", "dairy-free"], "to_check": ["The website lists 860 g of peppers but also \"2 medium bell peppers\". Two medium peppers weigh roughly 300–400 g, so 860 g looks wrong (or it means five or six peppers). Check before shopping. The colour of the peppers is not given.", "The website says \"200C/392 F (fan)\". 392°F is 200°C conventional, so it is unclear whether 200°C is meant to be fan. Used 200°C fan as the page states; lower to 180°C fan if the top browns too fast.", "Herbs, salt, pepper and oil are \"to taste\" on the page; no amounts are given. The page gives no servings.", "Total time is prep plus cook (the page gives no total).", "Creator name shown as \"Francesca\" (the profile name also carries a flag emoji).", "The video adds nothing beyond the website, apart from confirming the method."], "notes": ["Courgette is the classic version; the same site has a courgette and potato scarpaccia.", "Keeps well for a lunchbox once cool."]}, {"id": "spaghetti-alla-nerano", "title": "Spaghetti alla Nerano", "code": "C95m3lGy4Te", "creator": "@heresyourbite", "creator_name": "Claire", "source_url": "https://www.instagram.com/p/C95m3lGy4Te/", "total_min": 40, "servings": 2, "course": "main", "mood": ["something special", "fresh & green"], "larder": "mixed", "perishables": ["courgette", "basil"], "seasons": ["summer", "autumn"], "ingredients_canonical": ["olive oil", "garlic", "courgette", "salt", "pasta", "butter", "parmesan", "basil", "black pepper", "lemon", "chilli flakes", "water"], "contains_meat": false, "status": "needs_checking", "intro": "Courgettes fried until golden in garlic-scented oil, then tossed with spaghetti, butter, parmesan and basil until the sauce turns silky. It is a buttery, quietly extravagant supper for the height of courgette season, finished with lemon and chilli, which the creator says is not traditional.", "ingredients": [{"text": "Olive oil, a generous amount (amount not given)"}, {"text": "2 garlic cloves, crushed"}, {"text": "2-3 small courgettes (size not given)"}, {"text": "Flaky salt"}, {"text": "225 g spaghetti"}, {"text": "About 240 ml pasta cooking water, reserved"}, {"text": "15-30 g butter, plus more as needed"}, {"text": "About 70 g parmesan, freshly grated, plus extra to serve"}, {"text": "4-5 basil leaves, torn"}, {"text": "Black pepper"}, {"text": "Lemon juice, to finish"}, {"text": "Chilli flakes, to finish"}], "steps": [{"text": "Pour a generous amount of olive oil into a large frying pan over medium-low (4). The courgettes do not need to be submerged. Add the crushed garlic and let it sizzle, then lift it out and throw it away.", "timer_min": null, "video_s": 15, "uses": ["olive oil", "garlic"]}, {"text": "Bring a pot of well-salted water to the boil (9). Cook the 225 g spaghetti until al dente, then keep about 240 ml of the cooking water before draining.", "timer_min": null, "video_s": null, "uses": ["pasta", "salt", "water"]}, {"text": "Cut the courgettes (see To check) and fry them in batches, so the pan is never crowded, turning now and then until lightly golden.", "timer_min": null, "video_s": 13, "uses": ["courgette", "olive oil"]}, {"text": "Lift each batch out onto a plate lined with kitchen paper and sprinkle at once with flaky salt.", "timer_min": null, "video_s": null, "uses": ["courgette", "salt"]}, {"text": "Pour the oil out of the pan. Return all the courgettes to the dry pan with a splash of pasta water and the pasta straight from the pot.", "timer_min": null, "video_s": 17, "uses": ["courgette", "pasta", "water"]}, {"text": "Add a couple of knobs of butter, another splash of pasta water and the torn basil. Stir.", "timer_min": null, "video_s": 20, "uses": ["butter", "basil", "water"]}, {"text": "Stir in a handful of parmesan, more butter and a little more pasta. Keep adding cheese, butter and pasta water, tasting as you go, until the sauce is silky and clings to the pasta.", "timer_min": null, "video_s": 22, "uses": ["parmesan", "butter", "water"]}, {"text": "Season with black pepper and taste for salt. Eat from the pan or serve with extra parmesan, with lemon juice and chilli flakes over the top.", "timer_min": null, "video_s": 28, "uses": ["black pepper", "salt", "parmesan", "lemon", "chilli flakes"]}], "cuisine": ["italian"], "diet": ["vegetarian", "pescatarian"], "to_check": ["Missing amounts: oil quantity, courgette size and how to cut them (the caption does not say), and the frying time (\"lightly golden\").", "Conversions and estimates: 1/2 lb is 225 g spaghetti; 1-2 T butter is 15-30 g; 3/4 cup parmesan is about 70 g; \"about a cup\" of pasta water is about 240 ml. Servings (2) and the timings are estimates, not stated by the creator.", "\"Red pepper\" in the caption is taken to mean chilli flakes.", "No website recipe is given in the caption."], "notes": ["Eyeball the sauce rather than measure: the creator says to keep adding cheese, butter and pasta water until it looks right.", "Parmesan is traditionally made with animal rennet, so strict vegetarians may prefer a vegetarian hard cheese."]}, {"id": "sticky-soy-glazed-squash-with-peanut-lime-sauce", "title": "Sticky soy glazed squash with peanut lime sauce", "code": "DQE7kHzjDfR", "creator": "@twistedgreen", "creator_name": "Twisted Green", "source_url": "https://www.instagram.com/p/DQE7kHzjDfR/", "total_min": 75, "servings": null, "course": "main", "mood": ["warming", "spicy"], "larder": "mixed", "perishables": ["chives", "lime"], "seasons": ["autumn", "winter"], "ingredients_canonical": ["squash", "olive oil", "salt", "hoisin sauce", "sriracha", "agave syrup", "soy sauce", "rice vinegar", "sesame oil", "garlic", "ginger", "peanut butter", "water", "lime", "sesame seeds", "chives", "chilli crisp", "rice", "spring onion"], "contains_meat": false, "status": "needs_checking", "intro": "Wedges of roast squash, brushed again and again with a hoisin and sriracha glaze until the edges catch and turn lacquered, then set on a pool of peanut and lime sauce. It suits the first properly cold evenings, with rice alongside if you like.", "ingredients": [{"text": "1/2 Crown Prince squash or pumpkin (weight not given)"}, {"text": "Olive oil and salt"}, {"text": "2 tbsp hoisin sauce"}, {"text": "2 tbsp sriracha"}, {"text": "1 tbsp agave syrup"}, {"text": "1 tbsp soy sauce"}, {"text": "1/2 tbsp rice vinegar"}, {"text": "1 tsp sesame oil"}, {"text": "1 garlic clove, grated"}, {"text": "2.5 cm piece of ginger, peeled and grated"}, {"text": "100 g smooth peanut butter"}, {"text": "2 tbsp water (more if needed)"}, {"text": "3 tbsp soy sauce"}, {"text": "Juice of 1 lime"}, {"text": "2 tsp agave syrup"}, {"text": "1 tbsp white sesame seeds"}, {"text": "1 tbsp black sesame seeds"}, {"text": "1 tbsp chopped chives"}, {"text": "Chilli crisp, to taste (amount not given)"}, {"text": "Steamed rice and sliced spring onions, to serve (amounts not given)"}], "steps": [{"text": "Set the oven to 180°C fan. Scoop the seeds out of the half squash and cut it into 4-5 thick wedges, leaving the skin on (it softens as it roasts and is good to eat).", "timer_min": null, "video_s": 13, "uses": ["squash"]}, {"text": "Lay the wedges on a tray, drizzle with a splash of olive oil and sprinkle with salt. Roast for 45 minutes, until tender and starting to colour at the edges.", "timer_min": 45, "video_s": 13, "uses": ["squash", "olive oil", "salt"]}, {"text": "While the squash roasts, whisk together the glaze: hoisin, sriracha, 1 tbsp agave, 1 tbsp soy sauce, rice vinegar, sesame oil, grated garlic and ginger. Resist drinking it.", "timer_min": null, "video_s": 17, "uses": ["hoisin sauce", "sriracha", "agave syrup", "soy sauce", "rice vinegar", "sesame oil", "garlic", "ginger"]}, {"text": "After the 45 minutes, take the tray out and brush the wedges generously with the glaze. Return to the oven.", "timer_min": null, "video_s": 25, "uses": []}, {"text": "After another 10 minutes, brush with more glaze.", "timer_min": 10, "video_s": null, "uses": []}, {"text": "Switch the oven to grill and cook the wedges until the glaze bubbles and caramelises, brushing on more glaze as often as you like for a thick sticky coating. The grill time is not given, so watch it closely (sugar burns fast).", "timer_min": null, "video_s": 25, "uses": []}, {"text": "Whisk together the peanut sauce: 100 g peanut butter, 2 tbsp water, 3 tbsp soy sauce, the lime juice and 2 tsp agave, adding a splash more water until it is creamy and pourable.", "timer_min": null, "video_s": 28, "uses": ["peanut butter", "water", "soy sauce", "lime", "agave syrup"]}, {"text": "With the squash still on the tray, scatter over the white and black sesame seeds and the chives.", "timer_min": null, "video_s": 32, "uses": ["sesame seeds", "chives"]}, {"text": "Spread the peanut sauce over a serving plate, set the wedges on top and finish with a spoonful of chilli crisp. Eat with steamed rice and sliced spring onions if you like.", "timer_min": null, "video_s": 36, "uses": ["chilli crisp", "rice", "spring onion"]}], "cuisine": ["fusion"], "diet": ["vegan",
