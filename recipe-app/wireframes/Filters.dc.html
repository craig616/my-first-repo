<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1F1D}a:hover{color:#000}
.lbl{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5C5C57}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid #C9C9C4;border-radius:20px;background:#fff;font:500 14px 'IBM Plex Sans',sans-serif;color:#1F1F1D;cursor:pointer;box-sizing:border-box}
.chip-on{background:#1F1F1D;color:#fff;border-color:#1F1F1D}
.btn,.btn:hover{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:#C2410C;color:#fff;font-weight:600;font-size:17px;text-decoration:none}
.icon{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid #DADAD5;color:#1F1F1D;text-decoration:none;box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F4F2; font-family: 'IBM Plex Sans', sans-serif; color: #1F1F1D; overflow: hidden; box-sizing: border-box">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #DADAD5">
    <a href="Main.dc.html" class="icon" aria-label="Close filters">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">Filters</h1>
    <button type="button" onClick="{{clear}}" style="min-height: 44px; padding: 0 8px; border: 0; background: transparent; font: 500 15px 'IBM Plex Sans', sans-serif; color: #1F1F1D; text-decoration: underline; cursor: pointer">Clear</button>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span class="lbl">{{g.name}}</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
            <button type="button" class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.pick}}">{{it.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 16px 22px; background: #fff; border-top: 1px solid #DADAD5">
    <a href="Main.dc.html" class="btn">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { "Midweek dinner": true, "Veggie": true, "Under 30 min": true } };
  }
  renderVals() {
    var self = this;
    var defs = [
      { name: "Meal", items: ["Breakfast", "Lunch", "Midweek dinner", "Fakeaway", "Weekend project", "Baking", "Sides"] },
      { name: "Main ingredient", items: ["Chicken", "Beef", "Pork", "Fish", "Tofu", "Eggs", "Pasta", "Rice"] },
      { name: "Cuisine", items: ["British", "Italian", "Indian", "Japanese", "Korean", "Mexican", "Middle Eastern"] },
      { name: "Diet", items: ["Veggie", "Vegan", "Gluten-free", "Dairy-free"] },
      { name: "Time", items: ["Under 15 min", "Under 30 min", "Under 1 hour"] },
      { name: "Other", items: ["Not cooked yet", "Rated 4★ and up", "Craig's favourites", "[Partner]'s favourites", "Have everything"] }
    ];
    var count = 0;
    var groups = defs.map(function (g) {
      return {
        name: g.name,
        items: g.items.map(function (l) {
          var on = !!self.state.on[l];
          if (on) count++;
          return {
            label: l, on: on ? "true" : "false", cls: on ? "chip chip-on" : "chip",
            pick: function () {
              var o = Object.assign({}, self.state.on);
              o[l] = !o[l];
              self.setState({ on: o });
            }
          };
        })
      };
    });
    return {
      groups: groups,
      cta: count ? "Show recipes (" + count + " filters)" : "Show all recipes",
      clear: function () { self.setState({ on: {} }); }
    };
  }
}
</script>
</body>
</html>
