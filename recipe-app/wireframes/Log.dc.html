<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>After cooking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1F1D}a:hover{color:#000}
.lbl{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5C5C57}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid #C9C9C4;border-radius:20px;background:#fff;font:500 14px 'IBM Plex Sans',sans-serif;color:#1F1F1D;cursor:pointer;box-sizing:border-box}
.chip-on{background:#1F1F1D;color:#fff;border-color:#1F1F1D}
.btn,.btn:hover{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:#C2410C;color:#fff;font-weight:600;font-size:17px;text-decoration:none}
.btn2{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;border:1px solid #C9C9C4;background:#fff;color:#1F1F1D;font-weight:500;font-size:15px;text-decoration:none}
.card{background:#fff;border:1px solid #DADAD5;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F4F2; font-family: 'IBM Plex Sans', sans-serif; color: #1F1F1D; overflow: hidden; box-sizing: border-box">
  <div style="flex: 1; overflow-y: auto; padding: 22px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span class="lbl">Cooked today · by Craig</span>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">How did it go?</h1>
      <span style="font-size: 15px; color: #5C5C57">Sticky miso aubergine · v3</span>
    </div>

    <div class="card">
      <span style="font-weight: 600">Rating</span>
      <div style="display: flex; gap: 6px" role="group" aria-label="Rating out of 5">
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
          <button type="button" aria-label="{{s.label}}" onClick="{{s.pick}}" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #DADAD5; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="#1F1F1D" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>

    <div class="card">
      <span style="font-weight: 600">Would you cook it again?</span>
      <div style="display: flex; gap: 8px">
        <button type="button" class="{{yesCls}}" onClick="{{yes}}">Yes</button>
        <button type="button" class="{{maybeCls}}" onClick="{{maybe}}">With changes</button>
        <button type="button" class="{{noCls}}" onClick="{{no}}">No</button>
      </div>
    </div>

    <div class="card">
      <span style="font-weight: 600">Quick notes</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
          <button type="button" class="{{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button>
        </sc-for>
      </div>
      <label for="notes" class="lbl" style="margin-top: 4px">Anything else?</label>
      <textarea id="notes" rows="3" placeholder="e.g. Glaze caught under the grill. Try the middle shelf." style="font: 400 15px 'IBM Plex Sans', sans-serif; border: 1px solid #C9C9C4; border-radius: 10px; padding: 10px 12px; resize: none; color: #1F1F1D"></textarea>
    </div>

    <div class="card" style="border-style: dashed; border-color: #A8A8A2">
      <span style="font-weight: 600">Change the recipe for next time?</span>
      <span style="font-size: 14px; color: #5C5C57">Edit quantities, steps or timings. We'll save it as v4 and keep v3 and the original.</span>
      <a href="Versions.dc.html" class="btn2">Edit recipe →</a>
    </div>
  </div>

  <div style="padding: 12px 16px 22px; background: #fff; border-top: 1px solid #DADAD5; display: flex; flex-direction: column; gap: 8px">
    <a href="Versions.dc.html" class="btn">Save to cook log</a>
    <a href="Main.dc.html" style="text-align: center; font-size: 14px; padding: 6px">Skip for now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rating: 4, again: "maybe", tags: { "Needed longer": true } };
  }
  renderVals() {
    var self = this;
    var stars = [1, 2, 3, 4, 5].map(function (n) {
      return {
        label: n + (n === 1 ? " star" : " stars"),
        fill: n <= self.state.rating ? "#1F1F1D" : "none",
        pick: function () { self.setState({ rating: n }); }
      };
    });
    var labels = ["Great as is", "Too salty", "Too sweet", "Too spicy", "Needed longer", "Overcooked", "Portions too small"];
    var tags = labels.map(function (l) {
      var on = !!self.state.tags[l];
      return {
        label: l, on: on ? "true" : "false",
        cls: on ? "chip chip-on" : "chip",
        pick: function () {
          var t = Object.assign({}, self.state.tags);
          t[l] = !t[l];
          self.setState({ tags: t });
        }
      };
    });
    var a = this.state.again;
    function cls(v) { return a === v ? "chip chip-on" : "chip"; }
    return {
      stars: stars, tags: tags,
      yesCls: cls("yes"), maybeCls: cls("maybe"), noCls: cls("no"),
      yes: function () { self.setState({ again: "yes" }); },
      maybe: function () { self.setState({ again: "maybe" }); },
      no: function () { self.setState({ again: "no" }); }
    };
  }
}
</script>
</body>
</html>
