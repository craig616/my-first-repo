<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Versions and cook log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1F1D}a:hover{color:#000}
.lbl{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5C5C57}
.icon{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid #DADAD5;color:#1F1F1D;text-decoration:none;box-sizing:border-box}
.seg{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font:500 14px 'IBM Plex Sans',sans-serif;color:#3D3D39;cursor:pointer}
.seg-on{background:#fff;color:#1F1F1D;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:#EDEDE8;font-size:12px;color:#3D3D39}
.small{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid #C9C9C4;background:#fff;font:500 13px 'IBM Plex Sans',sans-serif;color:#1F1F1D;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F4F2; font-family: 'IBM Plex Sans', sans-serif; color: #1F1F1D; overflow: hidden; box-sizing: border-box">
  <div style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #DADAD5">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Recipe.dc.html" class="icon" aria-label="Back to recipe">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column">
        <span class="lbl">Sticky miso aubergine</span>
        <h1 style="margin: 0; font-size: 22px; font-weight: 700">Our versions</h1>
      </div>
    </div>
    <div style="display: flex; gap: 4px; padding: 4px; background: #E6E6E1; border-radius: 12px" role="tablist">
      <button type="button" role="tab" class="{{histCls}}" aria-selected="{{histSel}}" onClick="{{showHist}}">Recipe history</button>
      <button type="button" role="tab" class="{{logCls}}" aria-selected="{{logSel}}" onClick="{{showLog}}">Cook log</button>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 16px">
    <sc-if value="{{isHist}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 0">
        <sc-for list="{{versions}}" as="v" hint-placeholder-count="3">
          <div style="display: flex; gap: 12px">
            <div style="display: flex; flex-direction: column; align-items: center; width: 20px">
              <div style="width: 14px; height: 14px; border-radius: 7px; margin-top: 18px; background: {{v.dot}}; border: 2px solid #1F1F1D; box-sizing: border-box"></div>
              <div style="flex: 1; width: 2px; background: #C9C9C4"></div>
            </div>
            <div style="flex: 1; margin-bottom: 12px; padding: 14px; background: #fff; border: 1px solid #DADAD5; border-radius: 14px; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between; align-items: center">
                <span style="font-weight: 700; font-size: 16px">{{v.name}}</span>
                <sc-if value="{{v.current}}" hint-placeholder-val="{{false}}">
                  <span class="tag" style="background: #1F1F1D; color: #fff">Cooking from this</span>
                </sc-if>
              </div>
              <span style="font-size: 13px; color: #5C5C57">{{v.meta}}</span>
              <sc-for list="{{v.changes}}" as="ch" hint-placeholder-count="2">
                <div style="display: flex; gap: 8px; font-size: 14px; line-height: 1.4">
                  <span aria-hidden="true" style="color: #5C5C57">•</span>
                  <span>{{ch}}</span>
                </div>
              </sc-for>
              <div style="display: flex; gap: 8px; margin-top: 2px">
                <a href="Recipe.dc.html" class="small">View</a>
                <sc-if value="{{v.notCurrent}}" hint-placeholder-val="{{true}}">
                  <a href="Recipe.dc.html" class="small">Go back to this version</a>
                </sc-if>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isLog}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{cooks}}" as="c" hint-placeholder-count="3">
          <div style="padding: 14px; background: #fff; border: 1px solid #DADAD5; border-radius: 14px; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; justify-content: space-between">
              <span style="font-weight: 600">{{c.date}}</span>
              <span style="font-weight: 600">{{c.stars}}</span>
            </div>
            <span style="font-size: 13px; color: #5C5C57">{{c.who}}</span>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <sc-for list="{{c.tags}}" as="t" hint-placeholder-count="1">
                <span class="tag">{{t}}</span>
              </sc-for>
            </div>
            <span style="font-size: 14px; line-height: 1.45">{{c.note}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: "hist" };
  }
  renderVals() {
    var self = this;
    var hist = this.state.tab === "hist";
    var versions = [
      { name: "v3", meta: "4 Oct 2026 · Craig · after cooking", changes: ["Grill 4 min instead of 2", "Honey 1 tbsp → ½ tbsp (was too sweet)"], current: true },
      { name: "v2", meta: "21 Sep 2026 · [Partner]", changes: ["Added jasmine rice to serve", "Gas mark added to oven step"] },
      { name: "Original", meta: "12 Sep 2026 · Imported from Instagram · @[creator]", changes: ["Extracted from video transcript and on-screen text"] }
    ].map(function (v) {
      return { name: v.name, meta: v.meta, changes: v.changes, current: !!v.current, notCurrent: !v.current, dot: v.current ? "#C2410C" : "#fff" };
    });
    var cooks = [
      { date: "4 Oct 2026", stars: "★★★★☆", who: "Cooked by Craig · v2", tags: ["Too sweet", "Needed longer"], note: "Glaze didn't caramelise in 2 min. Less honey next time." },
      { date: "27 Sep 2026", stars: "★★★★★", who: "Cooked by [Partner] · v2", tags: ["Great as is"], note: "Doubled it for friends, worked well." },
      { date: "14 Sep 2026", stars: "★★★★☆", who: "Cooked by Craig · Original", tags: ["Portions too small"], note: "Needs rice to make it a meal." }
    ];
    return {
      isHist: hist, isLog: !hist,
      histCls: hist ? "seg seg-on" : "seg", logCls: hist ? "seg" : "seg seg-on",
      histSel: hist ? "true" : "false", logSel: hist ? "false" : "true",
      showHist: function () { self.setState({ tab: "hist" }); },
      showLog: function () { self.setState({ tab: "log" }); },
      versions: versions, cooks: cooks
    };
  }
}
</script>
</body>
</html>
